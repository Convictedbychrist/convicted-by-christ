try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
let saveTimer=null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ return false; } }
function saveSoon(){ clearTimeout(saveTimer); setStatus("Saving…"); saveTimer=setTimeout(()=>{ setStatus(save() ? "Saved on this device" : "Couldn't save on this device"); },400); }
function setStatus(t){ const el=document.getElementById("status"); if(el) el.textContent=t; }
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lessonStats(L){
  let total=0, filled=0;
  for(const b of L.blocks){ if(b.t==="f"||b.t==="check"){ total++; const v=state.a[L.n+":"+b.id]; if(v && (Array.isArray(v)?v.length:String(v).trim())) filled++; } }
  return {total, filled};
}
function isDone(n){ return state.done.includes(n); }

function renderHome(){
  document.title="Convicted by Christ · New Discipleship Bible Study";
  const doneCount=state.done.length;
  const nextL = LESSONS.find(L=>!isDone(L.n));
  let html=`<div class="hero-top"><div class="cbclogo hero-art" role="img" aria-label="Convicted by Christ"></div></div><header class="hero"><div class="wrap">
    <h1>New Discipleship Bible Study</h1>
    <p class="from">24 lessons from Isaiah 42:16 Ministries</p>
    <blockquote>“And I will bring the blind by a way that they knew not; I will lead them in paths that they have not known: I will make darkness light before them, and crooked things straight.”<cite>Isaiah 42:16 (KJV)</cite></blockquote>
    <div class="namebox"><label for="nm">Your name</label><input id="nm" autocomplete="name" value="${esc(state.name)}" placeholder="Write your name"></div>
    <p class="progress-line">${doneCount===0?"Start with Lesson One and work your way along the path.":doneCount===24?"<strong>All 24 lessons finished.</strong> Praise God, you made it!":`<strong>${doneCount} of 24</strong> lessons finished.`}</p>
  </div></header>
  <main class="wrap"><div class="trail-wrap"><svg class="trail-svg" aria-hidden="true"><path id="p-all"></path><path id="p-lit" class="lit"></path></svg><ol class="trail">`;
  LESSONS.forEach((L,i)=>{
    const s=lessonStats(L); const d=isDone(L.n);
    const cls=d?"done":(nextL&&nextL.n===L.n?"next":(s.filled?"started":""));
    const sentOn=(state.sent||{})[L.n]; const meta=sentOn?"Sent":d?"Finished":(s.filled?`${s.filled} of ${s.total} answered`:`${s.total} questions`);
    html+=`<li class="stop ${cls}" data-i="${i}"><a href="#/lesson/${L.n}"><span class="stone">${d?"✓":L.n}</span><span><span class="title">${esc(L.title)}</span><span class="meta">Lesson ${L.n} · ${meta}</span></span></a></li>`;
  });
  html+=`</ol></div>
  <div class="homeactions"><a class="btn" href="#/pick">Send my answers</a></div>
  <p class="finish">Finish all 24 lessons to receive a recovery Bible, a certificate of completion, and a footprint with your name and its meaning printed on it.</p>
  <div class="foot">Your answers are saved in this browser on this device. <button id="reset" type="button">Erase all my answers</button></div></main>`;
  app.innerHTML=html;
  document.getElementById("nm").addEventListener("input",e=>{state.name=e.target.value; save();});
  document.getElementById("reset").addEventListener("click",()=>{ if(confirm("Erase every answer and your progress on this device? This can't be undone.")){ state={name:state.name,a:{},done:[],addr:state.addr||{}}; save(); renderHome(); }});
  layoutTrail();
}
function layoutTrail(){
  const wrap=document.querySelector(".trail-wrap"); if(!wrap) return;
  const stops=[...wrap.querySelectorAll(".stop")];
  const w=wrap.clientWidth;
  const amp=Math.max(0,Math.min(120,(w-300)/2.2));
  stops.forEach((s,i)=>{ s.style.setProperty("--x", (amp*(1+Math.sin(i*0.75)) ).toFixed(0)+"px"); });
  const wr=wrap.getBoundingClientRect();
  const pts=stops.map(s=>{const r=s.querySelector(".stone").getBoundingClientRect(); return [r.left-wr.left+r.width/2, r.top-wr.top+r.height/2];});
  const d=pts.map((p,i)=>{ if(!i) return `M${p[0]},${p[1]}`; const q=pts[i-1]; const my=(q[1]+p[1])/2; return `C${q[0]},${my} ${p[0]},${my} ${p[0]},${p[1]}`; }).join(" ");
  document.getElementById("p-all").setAttribute("d",d);
  let lastDone=-1; for(let i=0;i<stops.length;i++){ if(stops[i].classList.contains("done")) lastDone=i; else break; }
  document.getElementById("p-lit").setAttribute("d", lastDone>0 ? d.split(" C").slice(0,lastDone+1).join(" C") : "");
}
const refRe=/^((?:[1-3] )?[A-Z][a-z]+(?: of [A-Z][a-z]+| [A-Z][a-z]+)?\s(?:\d+[:\d\-,;.\s]*)(?:\s*(?:[1-3] )?[A-Z][a-z]+\s\d+[:\d\-,;.\s]*)*)(.*)$/;

function renderLesson(n, check){
  const L=LESSONS.find(x=>x.n===n); if(!L){ location.hash=""; return; }
  document.title=`Lesson ${n}: ${L.title}`;
  const key=id=>n+":"+id;
  let body="", openQ=null;
  for(const b of L.blocks){
    if(b.t==="p"){ body+=`<p class="t">${b.html}</p>`; }
    else if(b.t==="h"){ body+=`<h3>${b.html}</h3>`; }
    else if(b.t==="li"){ body+=`<ul><li>${b.html}</li></ul>`; }
    else if(b.t==="q"){ body+=`<div class="q"><div class="qh"><span class="n">${b.num}.</span><span class="ql">${b.label}</span></div></div>`; }
    else if(b.t==="check"){
      const v=state.a[key(b.id)]||[];
      body+=`<div class="checks" role="group" aria-label="Check all that apply">`+b.items.map((it,i)=>`<label><input type="checkbox" data-k="${key(b.id)}" data-i="${i}" ${v.includes(i)?"checked":""}>${esc(it)}</label>`).join("")+`</div>`;
    }
    else if(b.t==="f"){
      const v=state.a[key(b.id)]||"";
      const rows=Math.max(b.num?2:1, Math.min(b.rows,6));
      const fid="f"+b.id;
      if(b.num){
        body+=`<div class="q f"><div class="qh"><span class="n">${b.num}.</span><label class="ql" for="${fid}">${b.label}</label></div><textarea id="${fid}" rows="${rows}" data-k="${key(b.id)}">${esc(v)}</textarea></div>`;
      } else {
        body+=`<div class="f sub">${b.label?`<label class="fl" for="${fid}">${b.label}</label>`:""}<textarea id="${fid}" rows="${rows}" data-k="${key(b.id)}" ${b.label?"":'aria-label="More space for your answer"'}>${esc(v)}</textarea></div>`;
      }
    }
  }
  const d=isDone(n);
  const prev=LESSONS.find(x=>x.n===n-1), next=LESSONS.find(x=>x.n===n+1);
  const mv=state.a[key("mv")]||"";
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" id="back">‹ All lessons</button><span class="status" id="status">Lesson ${n} of 24</span></div></div>
  <div class="cbclogo lesson-banner" role="img" aria-label="Convicted by Christ"></div><main class="wrap">
    <div class="lesson-head" style="padding-top:8px"><p class="num">Lesson ${n}</p><h2>${esc(L.title)}</h2></div>
    <section class="verse" aria-label="Memory verse"><p class="lab">Memory verse</p><p>“${esc(L.verse)}”</p><p class="ref">${esc(L.ref)}</p>
      </section>
    <div class="body">${body}</div>
    <div class="end"><p>${d?"You've finished this lesson.":"When you've worked through every question, mark this lesson finished."}</p><div class="endrow"><button class="btn ${d?"ghost":""}" id="done" type="button">${d?"Mark as not finished":"Mark lesson finished"}</button><a class="btn ${d?"":"ghost"}" href="${n===24?"#/celebrate/24":"#/send/"+n}">Send this lesson</a></div></div>
    <nav class="pn">${prev?`<a class="btn ghost" href="#/lesson/${prev.n}"><span>‹ ${esc(prev.title)}</span></a>`:"<span></span>"}${next?`<a class="btn ghost" href="#/lesson/${next.n}"><span>${esc(next.title)} ›</span></a>`:`<a class="btn ghost" href="#/"><span>All lessons</span></a>`}</nav>
  </main>`;
  window.scrollTo(0,0);
  document.getElementById("back").onclick=()=>{location.hash="#/";};
  app.querySelectorAll("textarea").forEach(t=>{ grow(t); t.addEventListener("input",()=>{ state.a[t.dataset.k]=t.value; grow(t); saveSoon(); }); });
  app.querySelectorAll(".checks input").forEach(c=>c.addEventListener("change",()=>{
    const k=c.dataset.k, i=+c.dataset.i; let v=state.a[k]||[]; v=v.filter(x=>x!==i); if(c.checked) v.push(i); state.a[k]=v; saveSoon();
  }));
  if(check){
    const miss=missingFor(L); let first=null;
    for(const m of miss){ const el=m.mv ? document.getElementById("mvbox") : m.b.t==="check" ? app.querySelector(`.checks input[data-k="${n}:${m.b.id}"]`)?.closest(".checks") : app.querySelector(`textarea[data-k="${n}:${m.b.id}"]`); if(el){ el.classList.add("missing"); first=first||el; } }
    setStatus(miss.length?`${miss.length} still blank`:"All answered");
    if(first) setTimeout(()=>first.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}),50);
  }
  app.querySelectorAll("textarea").forEach(t=>t.addEventListener("input",()=>{ if(t.value.trim()) t.classList.remove("missing"); }));
  app.querySelectorAll(".checks input").forEach(c=>c.addEventListener("change",()=>{ const g=c.closest(".checks"); if(g.querySelector("input:checked")) g.classList.remove("missing"); }));
  document.getElementById("done").onclick=()=>{
    if(isDone(n)) state.done=state.done.filter(x=>x!==n); else state.done.push(n);
    save();
    if(!isDone(n)) { renderLesson(n); return; }
    location.hash = n===24 ? "#/celebrate/24" : "#/";
  };
}


function requiredFields(L){
  const out=[]; let q=null;
  for(const b of L.blocks){ if(b.num) q=b.num; if(b.t==="f"||b.t==="check") out.push({b,q}); }
  return out;
}
function isAnswered(L,b){
  const v=state.a[L.n+":"+b.id];
  if(b.t==="check") return Array.isArray(v)&&v.length>0;
  return !!(v||"").trim();
}
function missingFor(L){ return requiredFields(L).filter(r=>!isAnswered(L,r.b)); }
function missingList(list){ return list.map(n=>{const L=LESSONS.find(x=>x.n===n); return {L, miss:missingFor(L)};}).filter(x=>x.miss.length); }
function needPanel(gaps){
  const total=gaps.reduce((s,g)=>s+g.miss.length,0);
  return `<div class="need" role="alert"><h3>${total} ${total===1?"answer is":"answers are"} still blank</h3>
  <p>Every question needs an answer before you can send.</p>
  <ul>${gaps.map(g=>{ const qs=[...new Set(g.miss.map(m=>m.q).filter(Boolean))];
    const parts=[]; if(g.miss.some(m=>m.mv)) parts.push("memory verse"); if(qs.length) parts.push((qs.length===1?"question ":"questions ")+qs.join(", "));
    return `<li><span><b>Lesson ${g.L.n}</b>, ${parts.join(" and ")}</span><a href="#/lesson/${g.L.n}/check">Finish Lesson ${g.L.n} ›</a></li>`; }).join("")}</ul></div>`;
}

function parseList(s){ return [...new Set(s.split(",").map(Number).filter(n=>n>=1&&n<=24))].sort((a,b)=>a-b); }
const plain=h=>{ const d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); };
const ADDR_REQ=["name","street","city","state","zip"];
function addrOk(){ const a=state.addr||{}; return ADDR_REQ.every(k=>(a[k]||"").trim()) && /^\d{5}(-\d{4})?$/.test((a.zip||"").trim()); }
function studentName(){ return (state.addr&&state.addr.name||"").trim() || (state.name||"").trim(); }
function lessonText(L){
  const val=id=>state.a[L.n+":"+id];
  const out=[`LESSON ${L.n}: ${L.title.toUpperCase()}`, `Memory verse: ${L.ref}`];
  let lastWasField=false;
  for(const b of L.blocks){
    if(b.t==="q"){ out.push("", `${b.num}. ${plain(b.label)}`); lastWasField=false; }
    else if(b.t==="f"){
      const v=(val(b.id)||"").trim();
      if(b.num){ out.push("", `${b.num}. ${plain(b.label)}`, `   Answer: ${v||"(no answer)"}`); }
      else if(b.label){ out.push(`   ${plain(b.label)}: ${v||"(no answer)"}`); }
      else if(v){ out.push(`   ${v}`); }
      else if(!lastWasField){ out.push("   (no answer)"); }
      lastWasField=true;
    }
    else if(b.t==="check"){ const c=val(b.id)||[]; const picked=b.items.filter((_,i)=>c.includes(i)); out.push(`   Checked: ${picked.length?picked.join("; "):"(none checked)"}`); lastWasField=true; }
  }
  return out.join("\n");
}
function buildEmail(list){
  const name=studentName()||"(name not given)";
  const range=list.length===1?`Lesson ${list[0]}`:`Lessons ${list.join(", ")}`;
  const subject=`${list.includes(24)?"COMPLETED STUDY: ":""}New Discipleship Bible Study, ${range}, ${name}`;
  const parts=[`Student: ${name}`];
  if(list.includes(24)){ const a=state.addr; parts.push("", "MAIL REWARD TO:", a.name, a.street+(a.unit?`, ${a.unit}`:""), `${a.city}, ${a.state} ${a.zip}`, "", "This student has completed all 24 lessons."); }
  parts.push(`Sent: ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}`);
  for(const n of list){ parts.push("", "────────────────────", lessonText(LESSONS.find(L=>L.n===n))); }
  return {subject, body:parts.join("\n")};
}
function renderPick(){
  document.title="Send my answers";
  const pre=LESSONS.filter(L=>isDone(L.n)).map(L=>L.n);
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" onclick="location.hash='#/'">‹ All lessons</button><span class="status"></span></div></div>
  <main class="wrap page"><h2>Send my answers</h2><p class="lede">Choose the lessons you want to send. Sending one or two at a time works best on most phones.</p>
  <div class="row"><button class="btn ghost" type="button" id="selDone">Select finished</button><button class="btn ghost" type="button" id="selNone">Clear</button></div>
  <ul class="pick">${LESSONS.map(L=>{const s=lessonStats(L);return `<li><label><input type="checkbox" value="${L.n}" ${pre.includes(L.n)?"checked":""}><span><span class="pt">${L.n}. ${esc(L.title)}</span><span class="pm">${isDone(L.n)?"Finished":(s.filled?`${s.filled} of ${s.total} answered`:"Not started")}</span></span></label></li>`}).join("")}</ul>
  <p class="err" id="err" role="alert"></p><button class="btn wide" type="button" id="go">Continue</button></main>`;
  window.scrollTo(0,0);
  const boxes=[...app.querySelectorAll(".pick input")];
  document.getElementById("selDone").onclick=()=>boxes.forEach(b=>b.checked=isDone(+b.value));
  document.getElementById("selNone").onclick=()=>boxes.forEach(b=>b.checked=false);
  document.getElementById("go").onclick=()=>{
    const list=boxes.filter(b=>b.checked).map(b=>+b.value);
    if(!list.length){ document.getElementById("err").textContent="Choose at least one lesson to send."; return; }
    location.hash=(list.includes(24)?"#/celebrate/":"#/send/")+list.join(",");
  };
}
function renderCelebrate(list){
  if(missingList(list).length){ location.replace("#/send/"+list.join(",")); return; }
  document.title="Congratulations!";
  app.innerHTML=`<section class="celebrate"><canvas id="confetti" aria-hidden="true"></canvas><div class="inner"><div class="cbclogo celebrate-logo" role="img" aria-label="Convicted by Christ"></div>
    <h1>CONGRATULATIONS!</h1><p class="did">You did it!</p>
    <p class="note">Praise God, you made it! I pray that you have learned more about your Heavenly Father and how much He loves you and that He has a plan and purpose for your life.</p>
    <p class="sig">Carolyn Evans, Isaiah 42:16 Ministries</p>
    <p class="reward">You've finished all 24 lessons. Next, confirm your name and mailing address so we can send your recovery Bible, certificate of completion, and your footprint.</p>
    <a class="btn" href="#/address/${list.join(",")}">Continue</a></div></section>`;
  window.scrollTo(0,0);
  confetti();
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"); if(!c) return; const ctx=c.getContext("2d");
  const dpr=devicePixelRatio||1; const W=c.clientWidth, H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.scale(dpr,dpr);
  const cols=["#B98A3E","#F3D9A2","#D2AE6C","#8C6A2F","#FFFFFF","#B8BCC6"];
  const ps=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*80,y:H*.38,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function step(t){ if(!document.getElementById("confetti")) return; ctx.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if(t-t0<4500) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H); })(t0);
}
function renderAddress(list){
  document.title="Your mailing address";
  const a=Object.assign({name:state.name||""},state.addr||{});
  const f=(k,label,opt,ac,extra="")=>`<div class="${k==="city"?"city":""}"><label for="a-${k}">${label}${opt?' <span class="opt">(optional)</span>':""}</label><input id="a-${k}" data-k="${k}" autocomplete="${ac}" value="${esc(a[k]||"")}" ${extra}></div>`;
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" onclick="history.back()">‹ Back</button><span class="status"></span></div></div>
  <main class="wrap page form"><h2>Where should we mail your reward?</h2><p class="lede">Please check that your full name and mailing address are correct. This is where your recovery Bible, certificate, and footprint will be sent.</p>
  ${f("name","Full name",false,"name")}
  ${f("street","Street address or PO box",false,"address-line1")}
  ${f("unit","Apartment, unit, or suite",true,"address-line2")}
  <div class="grid3">${f("city","City",false,"address-level2")}${f("state","State",false,"address-level1",'maxlength="20"')}${f("zip","ZIP code",false,"postal-code",'inputmode="numeric" maxlength="10"')}</div>
  <p class="err" id="err" role="alert"></p>
  <button class="btn wide" type="button" id="go" style="margin-top:12px">Confirm my address</button></main>`;
  window.scrollTo(0,0);
  const ins=[...app.querySelectorAll(".form input")];
  ins.forEach(i=>i.addEventListener("input",()=>{ state.addr=state.addr||{}; state.addr[i.dataset.k]=i.value; if(i.dataset.k==="name") state.name=i.value; i.removeAttribute("aria-invalid"); save(); }));
  document.getElementById("go").onclick=()=>{
    state.addr=state.addr||{}; ins.forEach(i=>state.addr[i.dataset.k]=i.value.trim()); save();
    const missing=ins.filter(i=>ADDR_REQ.includes(i.dataset.k)&&!i.value.trim());
    ins.forEach(i=>i.setAttribute("aria-invalid", missing.includes(i)?"true":"false"));
    const zip=document.getElementById("a-zip");
    if(missing.length){ document.getElementById("err").textContent="Fill in your "+missing.map(i=>i.previousElementSibling.textContent.replace(" (optional)","").replace(/^(Full|Street|City|State)/,s=>s.toLowerCase())).join(", ")+"."; missing[0].focus(); return; }
    if(!/^\d{5}(-\d{4})?$/.test(zip.value.trim())){ zip.setAttribute("aria-invalid","true"); document.getElementById("err").textContent="Enter a 5-digit ZIP code."; zip.focus(); return; }
    location.hash="#/send/"+list.join(",");
  };
}
function renderSend(list){
  const gaps=missingList(list);
  if(gaps.length){
    document.title="Answers still needed";
    app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" onclick="location.hash='#/'">‹ All lessons</button><span class="status"></span></div></div>
    <main class="wrap page"><h2>Almost ready to send</h2>${needPanel(gaps)}</main>`;
    window.scrollTo(0,0); return;
  }
  if(list.includes(24) && !addrOk()){ location.replace("#/address/"+list.join(",")); return; }
  document.title="Send my answers";
  const needName=!studentName();
  const {subject,body}=buildEmail(list);
  const href=`mailto:${encodeURIComponent(SEND_TO).replace(/%40/g,"@")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const range=list.length===1?`Lesson ${list[0]}`:`${list.length} lessons`;
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" onclick="location.hash='#/'">‹ All lessons</button><span class="status" id="status"></span></div></div>
  <main class="wrap page form"><h2>Send ${range}</h2>
  ${needName?`<label for="sn">Your name</label><input id="sn" autocomplete="name" placeholder="Write your name"><p class="err" id="err" role="alert"></p>`:""}
  ${AUTO_SEND?`<button class="btn wide" type="button" id="auto">Send my answers</button><p class="hint" id="sendmsg" role="status"></p>`:""}
  <a class="btn ${AUTO_SEND?"ghost":""} wide" id="mail" href="${href}" style="margin-top:12px">Open in my email app</a>
  <details class="alt"><summary>Email app didn't open? Copy and paste instead</summary>
  <ol class="steps">
    <li><span class="sl">Send to</span><span class="sv">${esc(SEND_TO)}</span><button class="btn ghost cp" type="button" data-copy="to">Copy email address</button></li>
    <li><span class="sl">Subject</span><span class="sv" id="subj">${esc(subject)}</span><button class="btn ghost cp" type="button" data-copy="subj">Copy subject</button></li>
    <li><span class="sl">Your answers</span><span class="sv">Everything shown in the box below</span><button class="btn cp" type="button" data-copy="body">Copy answers</button></li>
  </ol>
  <p class="hint">Open your email, start a new message, and paste each one in its place. Then tap Send.</p></details>
  <label for="pv" style="margin-top:24px">What will be sent</label>
  <textarea id="pv" class="preview" readonly>${esc(body)}</textarea>
  </main>`;
  window.scrollTo(0,0);
  if(needName){
    const sn=document.getElementById("sn");
    sn.addEventListener("input",()=>{ state.name=sn.value; save(); const em=buildEmail(list); document.getElementById("subj").textContent=em.subject; document.getElementById("pv").value=em.body;
      document.getElementById("mail").href=`mailto:${SEND_TO}?subject=${encodeURIComponent(em.subject)}&body=${encodeURIComponent(em.body)}`; });
  }
  const nameCheck=()=>{ if(needName && !studentName()){ document.getElementById("err").textContent="Write your name first so we know who sent these answers."; document.getElementById("sn").focus(); return false; } return true; };
  document.getElementById("mail").addEventListener("click",ev=>{ if(!nameCheck()) ev.preventDefault(); });
  const auto=document.getElementById("auto");
  if(auto) auto.onclick=async()=>{
    if(!nameCheck()) return;
    const msg=document.getElementById("sendmsg");
    auto.disabled=true; auto.textContent="Sending…"; msg.textContent="";
    const em=buildEmail(list);
    const payload={_subject:em.subject,_template:"box",_captcha:"false","Student":studentName(),"Lessons":list.join(", ")};
    if(list.includes(24)){ const a=state.addr; payload["Mail reward to"]=`${a.name}, ${a.street}${a.unit?", "+a.unit:""}, ${a.city}, ${a.state} ${a.zip}`; }
    payload["Answers"]=em.body;
    try{
      const r=await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(SEND_TO),{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
      const j=await r.json().catch(()=>({}));
      if(r.ok && String(j.success)==="true"){ markSent(list); return renderSent(list); }
      throw new Error(j.message||"not sent");
    }catch(e){
      auto.disabled=false; auto.textContent="Try again";
      msg.textContent="Your answers didn't send. Check your internet connection and try again, or use Open in my email app below.";
    }
  };
  app.querySelectorAll(".cp").forEach(btn=>btn.onclick=async()=>{
    if(needName && !studentName()){ document.getElementById("err").textContent="Write your name first so we know who sent these answers."; document.getElementById("sn").focus(); return; }
    const kind=btn.dataset.copy;
    const text = kind==="to" ? SEND_TO : kind==="subj" ? document.getElementById("subj").textContent : document.getElementById("pv").value;
    const label=btn.dataset.label||(btn.dataset.label=btn.textContent);
    const ok=await copyText(text);
    app.querySelectorAll(".cp").forEach(b=>{ if(b!==btn && b.dataset.label) b.textContent=b.dataset.label; });
    btn.textContent = ok ? "Copied ✓" : "Press and hold the text to copy";
    if(!ok && kind==="body"){ const pv=document.getElementById("pv"); pv.focus(); pv.select(); }
  });
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{ const tmp=document.createElement("textarea"); tmp.value=text; tmp.setAttribute("readonly",""); tmp.style.position="fixed"; tmp.style.opacity="0"; document.body.appendChild(tmp); tmp.focus(); tmp.select(); tmp.setSelectionRange(0,text.length); const ok=document.execCommand("copy"); tmp.remove(); return ok; }catch(e){ return false; }
}
function markSent(list){ state.sent=state.sent||{}; const d=new Date().toISOString().slice(0,10); list.forEach(n=>state.sent[n]=d); save(); }
function renderSent(list){
  const next=LESSONS.find(L=>L.n===Math.max(...list)+1);
  const range=list.length===1?`Lesson ${list[0]}`:`Lessons ${list.join(", ")}`;
  app.innerHTML=`<div class="bar"><div class="wrap"><button class="back" type="button" onclick="location.hash='#/'">‹ All lessons</button><span class="status"></span></div></div>
  <main class="wrap page"><h2>Sent ✓</h2><p class="lede">Your answers for ${range} are on their way. Thank you for your hard work in God's Word.</p>
  ${next?`<a class="btn wide" href="#/lesson/${next.n}">Start Lesson ${next.n}: ${esc(next.title)}</a>`:""}
  <a class="btn ghost wide" href="#/" style="margin-top:12px">Back to all lessons</a></main>`;
  window.scrollTo(0,0);
}
function grow(t){ t.style.height="auto"; t.style.height=(t.scrollHeight+2)+"px"; }
function route(){
  const h=location.hash;
  let m=h.match(/^#\/lesson\/(\d+)(\/check)?/); if(m) return renderLesson(+m[1], !!m[2]);
  if(h==="#/pick") return renderPick();
  m=h.match(/^#\/(celebrate|address|send)\/([\d,]+)/);
  if(m){ const list=parseList(m[2]); if(list.length){ return ({celebrate:renderCelebrate,address:renderAddress,send:renderSend})[m[1]](list); } }
  renderHome();
}
window.addEventListener("hashchange",route);
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(document.querySelector(".trail-wrap")) layoutTrail(); else app.querySelectorAll("textarea").forEach(grow); },150); });
if(document.fonts) document.fonts.ready.then(()=>{ if(document.querySelector(".trail-wrap")) layoutTrail(); });
route();
</script>
</body>

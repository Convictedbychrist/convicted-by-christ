 to God’s promises?", "rows": 2, "id": 40}, {"t": "f", "label": "What was the evidence that he believed God?", "rows": 1, "id": 41}, {"t": "f", "label": "Verse 20 How did he encourage others?", "rows": 2, "id": 42}, {"t": "f", "label": "Verses 22, 27 What was the outcome?", "rows": 2, "id": 43}, {"t": "f", "label": "What is one promise you have discovered in your Bible reading?", "rows": 3, "num": 7, "id": 44}, {"t": "f", "label": "Have you stood upon this promise in your prayer time expecting God to bring it to pass in your life or in the life of a loved one? Why or why not?", "rows": 2, "id": 45}, {"t": "p", "html": "Take time to pray and claim one of God’s promises. Make a list of God’s promises as you read the Word daily."}, {"t": "p", "html": "Keep going! You can do all things through Christ who will give you strength."}]}, {"n": 15, "title": "Knowing God’s Will", "ref": "Psalms 143:10", "verse": "Teach me to do Thy will, for Thou art my God; Let Thy good Spirit lead me on level ground.", "blocks": [{"t": "p", "html": "God’s will could be divided into two parts: His determined will and His desired will. God’s determined will is that which He has determined will happen regardless of what is going on in this world. God’s desired will includes those things that call for a human response, which leaves room for His desired will not to be fulfilled."}, {"t": "f", "label": "1 Thessalonians 4:16-17 is an example of God’s determined will. In your own words explain what will happen sometime in the future.", "rows": 3, "num": 1, "id": 0}, {"t": "f", "label": "Luke 13:34-35 is an example of God’s desired will. In your own words explain what God desired to take place, why it didn’t happen, and what were the results.", "rows": 3, "num": 2, "id": 1}, {"t": "p", "html": "This lesson will primarily deal with God’s desired will for our lives. The question most Christians ask is, “What does God want me to do?” The answer will hopefully become more clear to you as you study this lesson. There are three things that are prerequisites for the person who is seeking God’s will."}, {"t": "f", "label": "A. 1 Corinthians 2:12", "rows": 1, "id": 2}, {"t": "f", "label": "B. John 7:17", "rows": 1, "id": 3}, {"t": "f", "label": "C. Acts 5:29", "rows": 1, "id": 4}, {"t": "f", "label": "Psalms 32:8 Is it God’s will to give you personal direction and counsel?", "rows": 3, "num": 3, "id": 5}, {"t": "p", "html": "The steps in discovering His will could be summed up in three words: STOP, LOOK, AND LISTEN STOP AT GOD’S WORD"}, {"t": "q", "num": 4, "label": "Why must God’s Word have priority in our lives in order to know His will?"}, {"t": "f", "label": "A. Psalm 119:105", "rows": 1, "id": 6}, {"t": "f", "label": "B. Psalm 119:130", "rows": 1, "id": 7}, {"t": "f", "label": "John 16:13 Who helps you discern God’s will as you read His Word?", "rows": 2, "num": 5, "id": 8}, {"t": "p", "html": "The better we know His Word, the better we will know His will."}, {"t": "q", "num": 6, "label": "God’s Word contains His revealed will. These are black and white truths that eliminate all guesswork. From the following Scriptures what are some of these truths?"}, {"t": "f", "label": "A. 1 Thessalonians 4:3", "rows": 1, "id": 9}, {"t": "f", "label": "B. 1 Thessalonians 5:15-18", "rows": 1, "id": 10}, {"t": "f", "label": "C. 2 Corinthians 6:14", "rows": 2, "id": 11}, {"t": "f", "label": "According to God’s revealed will in 1 Corinthians 6:18, God tells us to", "rows": 1, "id": 12}, {"t": "f", "label": "sexual immorality. Sex outside of marriage between a man and a woman is sin.", "rows": 1, "id": 13}, {"t": "p", "html": "It doesn’t make sense to seek God’s will in prayer when He has already given a clear answer in His Word! <strong>God’s Word must have priority over feelings<\/strong>. Feelings can be very misleading."}, {"t": "f", "label": "God’s Word also contains principles to guide our lives. What does God say about these principles? A. 1 Timothy 5:21", "rows": 2, "num": 7, "id": 14}, {"t": "f", "label": "B. Hebrews 5:12", "rows": 1, "id": 15}, {"t": "p", "html": "Principles are general guidelines to assist us through the gray areas. They aren’t so much “do this” and “don’t do that,” but an appeal to use wisdom and discretion. God’s “revealed will” and His “principles” could be compared to our traffic laws. A sign that reads “speed limit 35\" is like God’s revealed will. A sign that reads “drive carefully” is a principle."}, {"t": "q", "num": 8, "label": "What are some of these principles?"}, {"t": "f", "label": "A. 2 Corinthians 9:6", "rows": 1, "id": 16}, {"t": "f", "label": "B. Galatians 6:7", "rows": 1, "id": 17}, {"t": "f", "label": "C. Matthew 6:33", "rows": 1, "id": 18}, {"t": "f", "label": "D. Matthew 7:12", "rows": 1, "id": 19}, {"t": "f", "label": "E. Romans 13:1", "rows": 1, "id": 20}, {"t": "f", "label": "F. Romans 13:8", "rows": 1, "id": 21}, {"t": "f", "label": "G. Psalms 37:3-5", "rows": 1, "id": 22}, {"t": "f", "label": "H. Proverbs 3:6", "rows": 1, "id": 23}, {"t": "h", "html": "LOOK AROUND AND WITHIN"}, {"t": "f", "label": "Acts 16:6-10 The believer must remain sensitive to God’s leading, not forcing his way into areas that God has not opened. Patience and timing are very important. How did the apostle Paul exhibit sensitivity and patience concerning God’s will and how did God lead Paul?", "rows": 3, "num": 9, "id": 24}, {"t": "q", "num": 10, "label": "Colossians 3:15 As you look within, what indication should you have that Christ is leading you?"}, {"t": "f", "label": "", "rows": 2, "id": 25}, {"t": "p", "html": "(Many Christians refer to this as “the witness of the Holy Spirit” as evidenced by inner peace)"}, {"t": "f", "label": "1 Corinthians 14:33 What is a sign that the Lord is NOT the one leading you?", "rows": 3, "num": 11, "id": 26}, {"t": "q", "num": 12, "label": "James 1:5-6; Psalm 27:14 What should you do if you don’t have clear direction?"}, {"t": "f", "label": "", "rows": 2, "id": 27}, {"t": "h", "html": "LISTEN TO THE COUNSEL OF GODLY PEOPLE"}, {"t": "f", "label": "Proverbs 27:17; Proverbs 20:5 What do these Scriptures mean to you?", "rows": 3, "num": 13, "id": 28}, {"t": "q", "num": 14, "label": "Lets’ look at some examples of Godly counsel."}, {"t": "f", "label": "A. Exodus 18:13-27 What was Moses’ problem and how was it solved?", "rows": 2, "id": 29}, {"t": "f", "label": "B. 1 Chronicles 27:32; Ezra 7:10 What type of person gives Godly counsel?", "rows": 1, "id": 30}, {"t": "f", "label": "C. Titus 2:3-5 Who should a young woman go to for counsel?", "rows": 2, "id": 31}, {"t": "h", "html": "SOME POINTS TO REMEMBER"}, {"t": "li", "html": "Three things should be in agreement concerning God’s will:"}, {"t": "p", "html": "The Word ● The witness of the Holy Spirit ● Doors to open and circumstances to line up"}]}, {"n": 16, "title": "Good Works", "ref": "Ephesians 2:10", "verse": "For we are His workmanship, created in Christ Jesus for Good Works, which God prepared beforehand, that we should walk in them.", "blocks": [{"t": "f", "label": "Ephesians 2:10 What is God’s purpose for us after we are saved?", "rows": 2, "num": 1, "id": 0}, {"t": "q", "num": 2, "label": "From the following Scriptures give a definition of “good works” Matthew 5:16; Colossians 3:17"}, {"t": "f", "label": "", "rows": 2, "id": 1}, {"t": "p", "html": "A good question to ask yourself concerning any “good work” you may want to do is, Am I doing this to bring glory to myself or to my Lord?"}, {"t": "q", "num": 3, "label": "Describe the following good works:"}, {"t": "f", "label": "Mark 14:3-9", "rows": 1, "id": 2}, {"t": "f", "label": "Matthew 25:34-40", "rows": 1, "id": 3}, {"t": "p", "html": "Good Works could be our personal worship of God or meeting the needs of others."}, {"t": "q", "num": 4, "label": "1 Corinthians 3:13-15 What future event will take place for the believer’s good works?"}, {"t": "f", "label": "", "rows": 2, "id": 4}, {"t": "p", "html": "Please note this is not a judgment of sin. Sin was judged at the cross for every Christian! This is a time of receiving rewards or suffering loss of rewards...not salvation."}, {"t": "q", "num": 5, "label": "From the following Scriptures, how has God equipped us to do these works?"}, {"t": "f", "label": "2 Timothy 3:16-17", "rows": 1, "id": 5}, {"t": "f", "label": "2 Corinthians 3:5-6", "rows": 1, "id": 6}, {"t": "f", "label": "Zechariah 4:6 Whose strength should you depend upon to do these works?", "rows": 2, "num": 6, "id": 7}, {"t": "q", "num": 7, "label": "What good works cannot do for you:"}, {"t": "f", "label": "Ephesians 2:8-9", "rows": 1, "id": 8}, {"t": "f", "label": "Romans 4:2-6", "rows": 1, "id": 9}, {"t": "f", "label": "Using Romans 3:20 and Romans 10:1-4 give a brief definition of “dead works.”", "rows": 3, "num": 8, "id": 10}, {"t": "q", "num": 9, "label": "The religious leader of Jesus’ day were very involved in “dead works.” According to the following Scriptures, what were some of these works?"}, {"t": "f", "label": "Mark 7:1-5; 8-13", "rows": 2, "id": 11}, {"t": "f", "label": "Matthew 6:1-7; 16-18", "rows": 2, "id": 12}, {"t": "f", "label": "Matthew 23:23, 28", "rows": 2, "id": 13}, {"t": "f", "label": "What is the one word that comes up repeatedly in Mark 7? (Verses 3, 5, 8, 9, 13)", "rows": 1, "id": 14}, {"t": "f", "label": "Were you raised with any religious traditions that you find difficult to break free from?", "rows": 1, "id": 15}, {"t": "f", "label": "1 Timothy 4:1-3 According to verse 1, who inspires people to do “dead works,” and what are some more dead works listed in verse 3?", "rows": 3, "num": 10, "id": 16}, {"t": "q", "num": 11, "label": "Philippians 3:1-9 The Apostle Paul repented from dead works. He refers to this as “putting no confidence in the flesh.” From the following verses give a short summary of his dead works."}, {"t": "f", "label": "Verse 5", "rows": 1, "id": 17}, {"t": "f", "label": "Verse 6", "rows": 1, "id": 18}, {"t": "p", "html": "How does Paul sum up all those years of works that he now knows were just “dead” works?"}, {"t": "f", "label": "Verse 8", "rows": 1, "id": 19}, {"t": "f", "label": "How does God view those “dead works?” (Isaiah 64:6)", "rows": 1, "id": 20}, {"t": "f", "label": "Philippians 3:12 What was Paul’s goal in life?", "rows": 2, "num": 12, "id": 21}, {"t": "f", "label": "Philippians 3:13; 4:13 How did Paul accomplish that goal?", "rows": 3, "num": 13, "id": 22}, {"t": "q", "num": 14, "label": "What was Paul able to say at the end of his life and what was he looking forward to?"}, {"t": "f", "label": "2 Timothy 4:6-7", "rows": 2, "id": 23}, {"t": "f", "label": "2 Timothy 4:8", "rows": 2, "id": 24}, {"t": "h", "html": "TO SUMMARIZE GOOD WORKS AND DEAD WORKS"}, {"t": "li", "html": "Dead Works are a legalistic effort to keep moral laws and ceremonial laws for the purpose of winning God’s favor; or any work done for the purpose of winning God’s favor. Dead works lead to self-righteousness."}, {"t": "li", "html": "A good work is doing all we can do for the glory of God, having no other motive such as personal gain or recognition."}, {"t": "li", "html": "Good works are an expression of our love for God and our fellow human beings."}, {"t": "li", "html": "Faith in Christ brings salvation, and salvation produces good works. Good works are the fruit of “saving faith.”"}, {"t": "p", "html": "Take time to pray and repent from any dead works in your life. Ask God to work through your life and lead you into the good works that He already prepared for you."}]}, {"n": 17, "title": "Sharing Your Testimony", "ref": "Romans 1:16", "verse": "For I am not ashamed of the gospel, for it is the power of God for salvation to everyone who believes, to the Jew first and also to the Greek.", "blocks": [{"t": "q", "num": 1, "label": "Mark 5:18-20 After Jesus healed the demon-possessed man, what did he tell him to do?"}, {"t": "f", "label": "", "rows": 2, "id": 0}, {"t": "f", "label": "Why do you think Jesus gave him these instructions?", "rows": 1, "id": 1}, {"t": "q", "num": 2, "label": "Ephesians 6:19 How does God want you to approach telling others about Christ?"}, {"t": "f", "label": "", "rows": 2, "id": 2}, {"t": "q", "num": 3, "label": "Contrast the following people and how they responded to Christ’s work in their lives. How did they act and why?"}, {"t": "f", "label": "John 12:42-43 (various rulers):", "rows": 1, "id": 3}, {"t": "f", "label": "Romans 1:15-16 (Apostle Paul):", "rows": 1, "id": 4}, {"t": "q", "num": 4, "label": "Why should Christians testify?"}, {"t": "f", "label": "Romans 10:13-15", "rows": 1, "id": 5}, {"t": "f", "label": "2 Corinthians 5:18-20", "rows": 1, "id": 6}, {"t": "f", "label": "1 Thessalonians 1:5; 1 Corinthians 2:4-5 Who actually converts an unbeliever to faith in Christ?", "rows": 2, "num": 5, "id": 7}, {"t": "f", "label": "Even though God wants you to share your testimony with a lost world, is it your persuasive speech that converts a sinner?", "rows": 2, "id": 8}, {"t": "f", "label": "John 9:25 The blind man whom Jesus healed had little or no theological training, yet he testified before the Pharisees. What did he say?", "rows": 2, "num": 6, "id": 9}, {"t": "f", "label": "What is your part in giving testimony and what is the Holy Spirit’s part?", "rows": 2, "id": 10}, {"t": "q", "num": 7, "label": "Acts 26:1-29 Paul gives his testimony to King Agrippa."}, {"t": "f", "label": "Verses 2-3 How did Paul begin his story?", "rows": 1, "id": 11}, {"t": "f", "label": "Verses 4-5, 9-11 What was his background prior to becoming a Christian?", "rows": 2, "id": 12}, {"t": "f", "label": "Verses 12-15 What changed him?", "rows": 2, "id": 13}, {"t": "f", "label": "Verse 23 How did Paul explain the gospel?", "rows": 2, "id": 14}, {"t": "f", "label": "Verse 27 Paul ended with a question to King Agrippa. What did he ask and why do you think he asked?", "rows": 3, "id": 15}, {"t": "f", "label": "Verse 28 What was Agrippa’s response to Paul’s testimony?", "rows": 2, "id": 16}, {"t": "f", "label": "Was Paul responsible for King Agrippa’s rejection of the gospel?", "rows": 1, "id": 17}, {"t": "p", "html": "Verse 29 Why did Paul even bother to give his testimony to people who were antagonistic?"}, {"t": "f", "label": "", "rows": 2, "id": 18}, {"t": "p", "html": "Now that you have seen how Paul shared his testimony, spend some time writing your testimony."}, {"t": "h", "html": "Remember these points"}, {"t": "li", "html": "Make it personal."}, {"t": "li", "html": "Don’t preach or condemn others."}, {"t": "li", "html": "Make it short."}, {"t": "li", "html": "Keep Christ central, highlighting what He has done for you."}, {"t": "li", "html": "Use Scripture. God’s Word cuts deep into men’s hearts, whereas man’s word holds no power and fades away. Paul quoted Jesus’ words many times during his testimony. (verses 14-18) Write it on a separate sheet of paper."}, {"t": "h", "html": "MY STORY: Carolyn Evans"}, {"t": "p", "html": "Tell a little about your life before you trusted Christ: I was very busy doing what I wanted to do and feeding my flesh, not really caring about myself or anyone else. I was so blinded to the fact that the Lord loved me so very much. I was so spiritually blinded to the things of the Lord and the destiny that He had for me. That there were actually people waiting for me on the other side of my destiny to hear the Word of the Lord."}, {"t": "p", "html": "Tell about your conversion—how you came to trust Christ: My friend was murdered in the parking lot of the hotel I was managing. She was stabbed fourteen times by her boyfriend. He was running from the parking lot when I ran face to face with him. The knife still in his hand. All he had to do was to put the knife through my heart and no one would have known it was him. But God had another plan for me and it was not to die in a parking lot. On Christmas Day of 1995, Jerry and I both committed our lives to the Lord."}, {"t": "p", "html": "Finally, tell what your life is like since meeting Him: Peace that passes all understanding."}, {"t": "p", "html": "Pray and ask God to give you opportunities to share your testimony."}]}, {"n": 18, "title": "Integrity", "ref": "Proverbs 10:9", "verse": "He who walks in integrity walks securely.", "blocks": [{"t": "q", "num": 1, "label": "From the following passage give a definition of integrity. Webster: Honesty"}, {"t": "f", "label": "Psalms 15:1-2", "rows": 1, "id": 0}, {"t": "q", "num": 2, "label": "According to the following Scriptures, what are the rewards of integrity?"}, {"t": "f", "label": "Psalms 15:1-2", "rows": 1, "id": 1}, {"t": "f", "label": "Proverbs 13:6", "rows": 1, "id": 2}, {"t": "f", "label": "Proverbs 20:7", "rows": 1, "id": 3}, {"t": "f", "label": "Isaiah 33:16", "rows": 1, "id": 4}, {"t": "f", "label": "Leviticus 19:11 God gives us some specific guidelines for living a life of integrity:", "rows": 3, "num": 3, "id": 5}, {"t": "f", "label": "Jeremiah 17:9 What fact makes it difficult to live an uncompromising lifestyle?", "rows": 3, "num": 4, "id": 6}, {"t": "f", "label": "Have you ever tried to justify an action which was wrong? If so, how did God work in your life to show you it was wrong?", "rows": 3, "id": 7}, {"t": "p", "html": "What are some ways we can be deceived?"}, {"t": "f", "label": "Ourselves: James 1:22", "rows": 1, "id": 8}, {"t": "f", "label": "Others: Romans 16:17-18", "rows": 1, "id": 9}, {"t": "f", "label": "Satan: 2 Corinthians 11:3-4", "rows": 1, "id": 10}, {"t": "q", "num": 5, "label": "Since we can be deceived in so many ways, how can we guard against this?"}, {"t": "f", "label": "Psalms 139:23-24", "rows": 1, "id": 11}, {"t": "f", "label": "Hebrews 4:12", "rows": 1, "id": 12}, {"t": "h", "html": "LET’S TAKE A LOOK AT TWO MEN OF INTEGRITY—THE APOSTLE PAUL AND DANIEL"}, {"t": "f", "label": "2 Corinthians 7:2; 1; Thessalonians 2:10 What qualities did Paul possess that identified him as a man of integrity?", "rows": 3, "num": 6, "id": 13}, {"t": "q", "num": 7, "label": "What guidelines helped Paul in his daily living?"}, {"t": "f", "label": "2 Corinthians 8:21", "rows": 1, "id": 14}, {"t": "f", "label": "Acts 24:16", "rows": 1, "id": 15}, {"t": "f", "label": "Based upon your knowledge of God and His Word, what do you think Paul did when God exposed any wrongdoing in his life? (Or do you think Paul never stumbled or sinned?) Give Scriptures to back up your answer", "rows": 3, "id": 16}, {"t": "q", "num": 8, "label": "Daniel 6:1-28 Daniel (a Jew in captivity during the reign of King Darius and King Cyrus) is given a top position in the kingdom."}, {"t": "f", "label": "Verse 3: What set Daniel apart from the others?", "rows": 2, "id": 17}, {"t": "f", "label": "Verse 4: What was discovered about Daniel’s work when his co-workers set about to discredit him?", "rows": 3, "id": 18}, {"t": "f", "label": "Verse 5-6: When they couldn’t discredit him, what did they decide to use against him?", "rows": 2, "id": 19}, {"t": "f", "label": "Verses 21-24 &amp; 28: Was God faithful to Daniel?", "rows": 2, "id": 20}, {"t": "f", "label": "What was the outcome of Daniel’s uncompromising lifestyle?", "rows": 2, "id": 21}, {"t": "f", "label": "FOOD FOR THOUGHT: If someone went through your work history with a fine-tooth comb, what report would be made?", "rows": 3, "id": 22}, {"t": "q", "num": 9, "label": "Meditate on 2 Corinthians 8:21 and Proverbs 3:3-4 and then consider the following list. Are any of these problem areas in you life?"}, {"t": "f", "label": "Exaggeration, flattery, stretching the truth:", "rows": 1, "id": 23}, {"t": "f", "label": "Cheating:", "rows": 1, "id": 24}, {"t": "f", "label": "White lies:", "rows": 1, "id": 25}, {"t": "f", "label": "Allowing people to believe a false impression:", "rows": 1, "id": 26}, {"t": "f", "label": "Failure to keep promises:", "rows": 1, "id": 27}, {"t": "f", "label": "Obtaining money or possessions through dishonest means:", "rows": 1, "id": 28}, {"t": "p", "html": "God is more concerned with how you live rather than where you live; how you work rather than where you work; the motives in which you minister rather than the quantity of ministry work you do. A little bit with God’s blessing goes much further than plenty without His blessing. Do your work as unto the Lord! (Colossians 3:3-4)"}, {"t": "p", "html": "You’re nearly finished, We pray you are learning a lot from these lessons. Be blessed."}]}, {"n": 19, "title": "Purity", "ref": "1 Corinthians 6:19-20", "verse": "Do you not know that your body is a temple of the Holy Spirit who is in you, whom you have from God, and that you are not you own? For you have been bought with a price; therefore glorify God in your body.", "blocks": [{"t": "q", "num": 1, "label": "Purity: Clean; Faultless"}, {"t": "q", "num": 2, "label": "According to the following Scriptures, what are God’s standards for our behavior?"}, {"t": "f", "label": "Matthew 5:27-28", "rows": 1, "id": 0}, {"t": "f", "label": "2 Corinthians 7:1", "rows": 1, "id": 1}, {"t": "f", "label": "1 Peter 3:3-4", "rows": 1, "id": 2}, {"t": "f", "label": "Ephesians 4:18-19 How does God describe those who practice impurity?", "rows": 2, "num": 3, "id": 3}, {"t": "q", "num": 4, "label": "1 Corinthians 6:12-20 From the following verses list reasons why we should flee immorality."}, {"t": "f", "label": "Verse 13", "rows": 1, "id": 4}, {"t": "f", "label": "Verse 15", "rows": 1, "id": 5}, {"t": "f", "label": "Verse 16", "rows": 1, "id": 6}, {"t": "f", "label": "Verse 18", "rows": 1, "id": 7}, {"t": "f", "label": "Verse 19", "rows": 1, "id": 8}, {"t": "f", "label": "Verse 20", "rows": 1, "id": 9}, {"t": "q", "num": 5, "label": "What do the following Scriptures warn us concerning sexual immorality and sexual perversion?"}, {"t": "f", "label": "Leviticus 18:22-25", "rows": 1, "id": 10}, {"t": "f", "label": "Deuteronomy 5:18", "rows": 1, "id": 11}, {"t": "f", "label": "Deuteronomy 27:20-23", "rows": 1, "id": 12}, {"t": "f", "label": "Romans 1:26-28", "rows": 1, "id": 13}, {"t": "f", "label": "1 Corinthians 5:1-2; 9-13", "rows": 1, "id": 14}, {"t": "f", "label": "Hebrews 13:4", "rows": 1, "id": 15}, {"t": "q", "num": 6, "label": "If a person has a lifestyle of sexual immorality, is it possible through Christ to change and walk in purity before God?"}, {"t": "f", "label": "1 Corinthians 6:9-11", "rows": 1, "id": 16}, {"t": "f", "label": "2 Corinthians 5:17", "rows": 1, "id": 17}, {"t": "q", "num": 7, "label": "What gives us the power to change?"}, {"t": "f", "label": "Isaiah 55:7", "rows": 1, "id": 18}, {"t": "f", "label": "1 John 1:9", "rows": 1, "id": 19}, {"t": "q", "num": 8, "label": "Galatians 3:13 What cleanses us from the curses connected with sexual perversion?"}, {"t": "f", "label": "", "rows": 2, "id": 20}, {"t": "f", "label": "Hebrews 9:14 Sexual sin not only affects a person physically; it also affects their emotional well-being. Is God able to cleanse even our conscience from guilt and shame?", "rows": 2, "num": 9, "id": 21}, {"t": "q", "num": 10, "label": "2 Samuel 11:1-27 King David committed adultery with Bathsheba."}, {"t": "f", "label": "Verse 1: Was David where he was supposed to be in the Spring of the year?", "rows": 1, "id": 22}, {"t": "f", "label": "Verse 2: How was David tempted?", "rows": 1, "id": 23}, {"t": "f", "label": "Verse 3: Did David plan out this sin, thinking it through?", "rows": 1, "id": 24}, {"t": "f", "label": "Verses 5 &amp; 15: What resulted from his sin of adultery?", "rows": 2, "id": 25}, {"t": "f", "label": "Verse 27: What was God’s view of David’s sin?", "rows": 2, "id": 26}, {"t": "f", "label": "2 Samuel 12:1-14 Briefly tell how God exposed David’s “secret sin”", "rows": 3, "num": 11, "id": 27}, {"t": "f", "label": "Verse 13: How did David respond to God?", "rows": 2, "id": 28}, {"t": "f", "label": "Verse 13: What was God’s response back to David?", "rows": 2, "id": 29}, {"t": "f", "label": "Verses 10 &amp; 14: What resulted from David’s sin?", "rows": 2, "id": 30}, {"t": "p", "html": "Note: Even though David repented before God and was forgiven, there was fallout from his act of adultery. Others were hurt. His sin was not a private affair. It hurt God, mate, children, and unbelievers!"}, {"t": "f", "label": "Genesis 39:7-12 Let’s take a look at another man of God, Joseph, and how he handled the same Verse 9: temptation. What kept Joseph from sinning with his masters’ wife?", "rows": 3, "num": 12, "id": 31}, {"t": "f", "label": "Verse 10: How often was this temptation presented to him?", "rows": 1, "id": 32}, {"t": "f", "label": "What did he have to do in order to resist?", "rows": 1, "id": 33}, {"t": "f", "label": "2 Timothy 2:22 What counsel did the Apostle Paul give to young Timothy?", "rows": 3, "num": 13, "id": 34}, {"t": "f", "label": "2 Timothy 2:21 What will result from becoming a clean vessel?", "rows": 3, "num": 14, "id": 35}, {"t": "f", "label": "Genesis 2:18; 24-25; 1 Corinthians 7:2-3 Under what condition is a sexual relationship pleasing to God?", "rows": 2, "num": 15, "id": 36}, {"t": "f", "label": "Proverbs 5:18-19; Song of Solomon 7:9-10 Does God want this relationship to be mutually pleasurable?", "rows": 2, "num": 16, "id": 37}, {"t": "f", "label": "Do you think God is unreasonable and old fashioned with His view of sexuality? Do you see His commands as restrictive or protective?", "rows": 2, "num": 17, "id": 38}, {"t": "q", "num": 18, "label": "What reasons might there be for not marrying?"}, {"t": "f", "label": "1 Corinthians 7:7-8; 32", "rows": 1, "id": 39}, {"t": "f", "label": "Matthew 19:10-12", "rows": 1, "id": 40}, {"t": "q", "num": 19, "label": "What are some steps we can take to live a pure life pleasing to our Lord?"}, {"t": "f", "label": "Psalms 51:10", "rows": 1, "id": 41}, {"t": "f", "label": "Proverbs 4:14-15", "rows": 1, "id": 42}, {"t": "f", "label": "Romans 13:14", "rows": 1, "id": 43}, {"t": "f", "label": "Philippians 4:8", "rows": 1, "id": 44}, {"t": "p", "html": "Take time to pray and ask God to forgive and cleanse any impurity in your life. Ask Him to remove the guilt and shame and replace it with His acceptance and righteousness."}]}, {"n": 20, "title": "Healing", "ref": "Psalms 103:2-3", "verse": "Bless the Lord, O my soul, and forget none of His benefits; Who pardons all your iniquities; Who heals all your diseases", "blocks": [{"t": "q", "num": 1, "label": "What is God’s will concerning healing?"}, {"t": "f", "label": "Exodus 15:26", "rows": 1, "id": 0}, {"t": "f", "label": "Psalms 103:3", "rows": 1, "id": 1}, {"t": "f", "label": "Psalms 147:3", "rows": 1, "id": 2}, {"t": "f", "label": "Isaiah 53:4-5", "rows": 1, "id": 3}, {"t": "f", "label": "Matthew 8:16", "rows": 1, "id": 4}, {"t": "f", "label": "Matthew 12:15", "rows": 1, "id": 5}, {"t": "f", "label": "Mark 1:40-41", "rows": 1, "id": 6}, {"t": "f", "label": "Luke 9:1", "rows": 1, "id": 7}, {"t": "f", "label": "Luke 9:11", "rows": 1, "id": 8}, {"t": "f", "label": "1 Peter 2:24", "rows": 1, "id": 9}, {"t": "f", "label": "3 John 2", "rows": 1, "id": 10}, {"t": "p", "html": "In the memory verse God revealed Himself in yet another way to the children of Israel. He said, “I am Jehovah Rophe,” which means “the Lord your health.” God often revealed Himself through different names. Each name of God reveals different aspects of His personality and provision. For further study of the names of God read God in You to You, and for You by Marilyn Hickey."}, {"t": "q", "num": 2, "label": "Someone may say, “But healing was only for then. Jesus doesn’t heal today.” What do the following Scriptures tell us about Jesus’ work?"}, {"t": "f", "label": "John 14:12", "rows": 1, "id": 11}, {"t": "f", "label": "Hebrews 13:8", "rows": 1, "id": 12}, {"t": "f", "label": "1 John 3:8", "rows": 1, "id": 13}, {"t": "f", "label": "Genesis 2:17; 3:16-19 Why did pain, sickness, and death first come to man?", "rows": 3, "num": 3, "id": 14}, {"t": "q", "num": 4, "label": "What are some other causes of sickness?"}, {"t": "f", "label": "Psalms 41: 4", "rows": 1, "id": 15}, {"t": "f", "label": "John 5:14", "rows": 1, "id": 16}, {"t": "f", "label": "Proverbs 14:30", "rows": 1, "id": 17}, {"t": "f", "label": "Luke 13:11,16", "rows": 1, "id": 18}, {"t": "f", "label": "John 9:1-4", "rows": 1, "id": 19}, {"t": "f", "label": "Acts 10:38", "rows": 1, "id": 20}, {"t": "f", "label": "1 Corinthians 11:27-30", "rows": 1, "id": 21}, {"t": "f", "label": "Ephesians 6:2-3", "rows": 1, "id": 22}, {"t": "p", "html": "Ephesians 6:2-3 is a difficult Word to accept for those who are victims of child abuse. Think of it this way: honoring abusive parents is forgiving them. This doesn’t mean that you allow abuse to continue; but you must not allow unforgiveness, bitterness, or hatred to continue in your heart. This is one commandment of God that has a promise with it. For your own good health, carefully consider God’s Word."}, {"t": "q", "num": 5, "label": "Healing can result from:"}, {"t": "f", "label": "Numbers 12:10-15; 1 Kings 13:1-6", "rows": 1, "id": 23}, {"t": "f", "label": "Psalms 107:20; Proverbs 4:20-22", "rows": 1, "id": 24}, {"t": "f", "label": "Matthew 9:20-22; Matthew 9:28-29", "rows": 1, "id": 25}, {"t": "f", "label": "Mark 16:17-18", "rows": 1, "id": 26}, {"t": "f", "label": "1 Corinthians 12:28", "rows": 1, "id": 27}, {"t": "f", "label": "James 5:14-16", "rows": 1, "id": 28}, {"t": "q", "num": 6, "label": "What are hindrances to receiving healing?"}, {"t": "f", "label": "2 Chronicles 16:12-13", "rows": 1, "id": 29}, {"t": "f", "label": "Matthew 13:58", "rows": 1, "id": 30}, {"t": "f", "label": "Psalms 66:18; Isaiah 59-12", "rows": 1, "id": 31}, {"t": "p", "html": "There is a difference between “willful” sin and weakness—someone who practices sin versus someone who occasionally stumbles in his Christian walk. Do you pray from the standpoint of repentance, or do you ignore your sin and try to bargain with God for the things you want or need? God is not interested in bargains. He wants your heart, not your works! Matthew 15:8, “This people honors Me with their lips, but their heart is far away from Me.” Seek the Healer rather than the healing. Seek Him and in Him you will have your needs met."}, {"t": "f", "label": "According to the following Scriptures, what are some other explanations why someone is not healed? 1 Kings 14: 9-13", "rows": 2, "num": 7, "id": 32}, {"t": "f", "label": "Isaiah 57:1-2", "rows": 1, "id": 33}, {"t": "f", "label": "Isaiah 55:8-9 Will you always be able to give a perfect explanation of everything that happens in life? Why or Why not?", "rows": 2, "num": 8, "id": 34}, {"t": "f", "label": "-", "rows": 1, "id": 35}, {"t": "f", "label": "Based on the Scriptures you have just studied, would it be important to know the source of someone’s sickness before you pray for them? Why?", "rows": 2, "id": 36}, {"t": "f", "label": "James 1:5 What should you pray before ministering healing to someone?", "rows": 3, "num": 10, "id": 37}, {"t": "p", "html": "If you are in need of healing, ask the Holy Spirit to search your life and reveal the cause. By faith, listen and do exactly what God instructs you to do, whether it is resisting a demon of infirmity; being anointed with oil; having hands laid on you; prayer of faith; confessing sins; letting go of unforgiveness or bitterness; reconciling with someone; meditating on His Word, etc. There are so many ways He has provided for our healing. Seek Him for your healing and He will show you the way."}, {"t": "p", "html": "Food for Thought<strong>: <\/strong>Luke was a physician (Colossians 4:14). He obviously witnessed and participated in many miracles of healing through Jesus Christ. He recorded a lot of miracles of healing in his gospel; yet he does not tell us that it is sinful to go to a doctor. (expensive maybe, but not sinful) Luke 8:43 “And a woman having an issue of blood twelve years, which had spent all her living upon physicians, neither could be healed of any” The sinful act is trusting a doctor more than you trust God. Do not be like King Asa who only trusted a physician and did not even seek God. Put your trust in God as the “Great Physician” and continually pray, seeking His wisdom as you reach out for healing. You need to be convinced that it is God’s will to heal! If you don’t believe it is His will to heal, why even bother going to the doctor?"}, {"t": "p", "html": "Take time to pray for your own healing or for someone else’s healing."}]}, {"n": 21, "title": "Fruit", "ref": "John 15:16", "verse": "You did not choose Me, but I chose you, and appointed you, that you should go and bear fruit, and that your fruit should remain, that whatever you ask of the Father in My name, He may give it to you.", "blocks": [{"t": "f", "label": "John 15:8 What will bring Glory to God?", "rows": 2, "num": 1, "id": 0}, {"t": "f", "label": "John 15:1-2 Who is the vine, the vinedresser (farmer), and the branches?", "rows": 3, "num": 2, "id": 1}, {"t": "f", "label": "What will the farmer do to make a branch more fruitful?", "rows": 1, "id": 2}, {"t": "p", "html": "(The word “prune” literally means “cleanse.”)"}, {"t": "f", "label": "John 15:3 How is a Christian cleansed?", "rows": 2, "num": 3, "id": 3}, {"t": "f", "label": "John 15:4-5 What is necessary for a Christian to bear fruit?", "rows": 2, "num": 4, "id": 4}, {"t": "p", "html": "Dictionary definitions of the word abide: <em>remain, reside, await, <\/em>keep a promise, obey, to be left when part is gone, stay, continue, live, be present, endure, stand, tolerate, last, wait for"}, {"t": "f", "label": "Matthew 7:15-20 How will people know true Christians from false Christians?", "rows": 3, "num": 5, "id": 5}, {"t": "f", "label": "Matthew 7:21-23; John 15:6 What will happen to those who do not abide in Christ and produce bad fruit?", "rows": 2, "num": 6, "id": 6}, {"t": "p", "html": "Note: Just as it takes time for a seed to grow, develop roots, bear green fruit and then ripen into mature fruit; so it takes time for a baby Christians to produce mature fruit. There will be a cleansing process taking place in his life; weeds will be pulled and diseased branches cut away. Be careful not to place a baby Christian in the same category as a false prophet or a wolf in sheep’s clothing! One is young and immature in his faith, while the other is cunning, skillful, and polished in his deception."}, {"t": "q", "num": 7, "label": "Galatians 5:22-23 List the fruit that God wants to produce in your life and give a brief definition of each fruit. (Challenge: using a concordance, find an additional Scripture that will add more insight to each fruit.)"}, {"t": "p", "html": "Fruit Definition Additional Scripture(s)"}, {"t": "f", "label": "Love", "rows": 1, "id": 7}, {"t": "f", "label": "Joy", "rows": 1, "id": 8}, {"t": "f", "label": "Peace", "rows": 1, "id": 9}, {"t": "f", "label": "Patience", "rows": 1, "id": 10}, {"t": "f", "label": "Kindness", "rows": 1, "id": 11}, {"t": "f", "label": "Goodness", "rows": 1, "id": 12}, {"t": "f", "label": "Faithfulness", "rows": 1, "id": 13}, {"t": "f", "label": "Gentleness", "rows": 1, "id": 14}, {"t": "f", "label": "Self-control", "rows": 1, "id": 15}, {"t": "p", "html": "“Against such things there is no law” (Galatians 5:23) means that a Holy Spirit-controlled man needs no law to cause him to live like Christ!"}, {"t": "p", "html": "All the fruit can be summed up in one word, LOVE. This is the God kind of love. It goes beyond human love. This good fruit will grow naturally as we abide in Christ. Trees don’t strain or struggle to grow fruit, and neither should Christians!"}, {"t": "f", "label": "1 John 4:8 Who is love?", "rows": 2, "num": 8, "id": 16}, {"t": "f", "label": "Romans 5:5 Who else has been given this same kind of love?", "rows": 2, "num": 9, "id": 17}, {"t": "p", "html": "Note: If God’s love has already been poured into a Christian’s heart, do we need to pray asking God to give us love? Shouldn’t we just accept His Word that we already have it and start thanking Him for His precious love in our hearts and look for opportunities to release it?"}, {"t": "f", "label": "1 Corinthians 13:4-8 gives further insight into the characteristics of Godly love. From this passage list what love is and what it is not.", "rows": 3, "num": 10, "id": 18}, {"t": "f", "label": "Galatians 5:19-21 In contrast to the fruit of the Spirit, what are some deeds of the flesh (or bad fruit)?", "rows": 2, "num": 11, "id": 19}, {"t": "f", "label": "1 John 4:18 Can love and fear exist together?", "rows": 2, "num": 12, "id": 20}, {"t": "f", "label": "Why or why not?", "rows": 2, "id": 21}, {"t": "q", "num": 13, "label": "Who should Christians love?"}, {"t": "f", "label": "Deuteronomy 6:5", "rows": 1, "id": 22}, {"t": "f", "label": "Luke 6:27", "rows": 1, "id": 23}, {"t": "f", "label": "1 Peter 4:8", "rows": 1, "id": 24}, {"t": "f", "label": "John 13:34-35 Why did Jesus place such emphasis on demonstrating love?", "rows": 3, "num": 14, "id": 25}, {"t": "f", "label": "1 John 3:16-18 Give some practical ways in which we show God’s love to others?", "rows": 3, "num": 15, "id": 26}, {"t": "p", "html": "Love is not an inner feeling but, rather, an act of the will. Love can be known only by the action it produces. A Christian is known by the fruit he produces."}, {"t": "h", "html": "Points to remember"}, {"t": "li", "html": "If love is the motivation for all that you do, God will be glorified."}, {"t": "li", "html": "Fruitfulness is not measured by the quantity of good works you do or the number of Christian activities in your life. A Christ-like character is far more important than the number of good works you do!"}, {"t": "li", "html": "True joy is JESUS ~OTHERS~YOURSELF"}, {"t": "li", "html": "Godly love is unselfish, unconditional, eternal, and it never fails."}, {"t": "p", "html": "Take time to pray and allow God to inspect your fruit. Ask Him to reveal the true motivation in your heart for the things that you do. Allow Him to cleanse and prune your inner attitudes and remove any bad fruit. Commit to spend time in His presence and in His Word, thus becoming a fruit bearing Christian. Are you bearing sweet fruit? The real test comes when you get squeezed, and then you’ll see what comes out of you! Hopefully, it will be sweet juice."}]}, {"n": 22, "title": "Spiritual Gifts", "ref": "Romans 12:6", "verse": "And since we have gifts that differ according to the grace given us, let each exercise accordingly.", "blocks": [{"t": "f", "label": "1 Corinthians 12:4-11 Who distributes gifts to the believers?", "rows": 2, "num": 1, "id": 0}, {"t": "f", "label": "1 Corinthians 12:7; 1 Peter 4:10 For what purpose are these gifts given?", "rows": 3, "num": 2, "id": 1}, {"t": "q", "num": 3, "label": "Romans 12:6-8 lists several different spiritual gifts. These gifts could be referred to as motivational gifts, gifts that provide the motivating force for our lives. Their definitions as well as Bible characters who operate in these gifts are listed below."}, {"t": "li", "html": "Prophecy: One who clearly perceives the will of God. John the Baptist (Luke 3:2-20;); Jeremiah (Jeremiah 1-52)"}, {"t": "li", "html": "Server (or doer): One who loves to serve others. Martha (Luke 10:38-42); Stephen (Acts 6:1-15; 7:1-60)"}, {"t": "li", "html": "Teacher: One who loves to research God’s Word and communicate its truth to others. Apollos (Acts 18:24-28; 1 Corinthians 3:6); Timothy (1 &amp; 2 Timothy)"}, {"t": "li", "html": "Exhorter: One who loves to encourage others to live a victorious life. Barnabas (Acts 4:36, 11:22-26); Titus (2 Corinthians 7:6-7, Titus)"}, {"t": "li", "html": "Giver: One who loves to give money, time, talent, and energy to benefit others and advance the gospel. Abraham (Genesis 13-14); Cornelius (Acts 10:1-31)"}, {"t": "li", "html": "Administration (or leader): One who loves to organize, lead or direct. Joseph (Genesis 37-40); Nehemiah (Nehemiah 1-7)"}, {"t": "li", "html": "Mercy (or compassion): One who has compassion, love and care for those in need. The good Samaritan (Luke 10:30-35); Ruth (Ruth)"}, {"t": "f", "label": "List the gifts named in 1 Corinthians 12:7-10.", "rows": 3, "num": 4, "id": 2}, {"t": "p", "html": "These gifts could be referred to as manifestation gifts. In 1 Corinthians 12:7 the Apostle Paul used the Greek word “phanerosis” “meaning” “an exhibition, expression, or manifestation.” Each of these gifts are defined as follows:"}, {"t": "li", "html": "Word of Wisdom: A revelation of wisdom beyond natural human wisdom that enables a person to know what to do or say. (This is not wisdom gained from academic achievement or experience)."}, {"t": "li", "html": "Word of Knowledge: A revelation of information for a person, group, or situation that could not have been known by any natural means. (The purpose of revealing such information would be to bring a person closer to Christ. If you receive a word of knowledge, pray and ask God how to handle it.)"}, {"t": "p", "html": "Note: Fortunetellers receive supernatural revelations about other people. The source of their supernatural gift is demonic (a spirit of divination operates through them) and they often bring fear, confusion or depression into people’s lives. These people are money motivated rather than love motivated. If you have been involved with fortunetellers or any other occult activity, you must repent and ask God to forgive you for seeking information from Satan rather than God."}, {"t": "p", "html": "Read the following Scriptures for more information about fortunetellers."}, {"t": "p", "html": "Leviticus 19:31; Deuteronomy 18:10-12; Isaiah 8:19; 1 Chronicles 10:13; Matthew 7:22-23; Acts 8:9-24; Acts 16:16-18)."}, {"t": "li", "html": "Faith: The kind of wonder working faith that moves mountains and waits expectantly for results."}, {"t": "li", "html": "Gifts of healings: The many different ways and varieties of degrees in which God manifests healing."}, {"t": "li", "html": "Working of miracles; The demonstration of the power and action of God that goes beyond natural laws."}, {"t": "li", "html": "Prophecy: An anointed proclamation of God through an individual to encourage, exhort, or comfort."}, {"t": "li", "html": "Discerning of Spirits: A person’s ability to perceive what type of spirit is in operation in a given situation whether it is the Holy Spirit, a demonic spirit or fleshly (human) manifestation."}, {"t": "li", "html": "Various kinds of tongues: The language given to the believer by the Holy Spirit but not learned or understood by the speaker."}, {"t": "li", "html": "Interpretation of tongues: The supernatural ability to express the content of what has been spoken in tongues."}, {"t": "q", "num": 5, "label": "Ephesians 4:11-13 List the gifts in this passage: These gifts are people...people who are called and gifted by God to train the whole Body of Christ, enabling them to do the work of the ministry so that Christ’s body on earth and the church can function as His true representative. These are not titles, but functions of certain people in the body of Christ. These ministry gifts are defined as follows:"}, {"t": "li", "html": "Apostles: One who establishes and strengthens churches"}, {"t": "li", "html": "Prophet: One who speaks forth the message of God"}, {"t": "li", "html": "Evangelist: One who is called to preach the Gospel"}, {"t": "li", "html": "Pastor: One who feeds and shepherds the believers"}, {"t": "li", "html": "Teacher<strong>:<\/strong> One who instructs believers in the Word of God"}, {"t": "f", "label": "1 Corinthians 13:1-8 What must always be our motivation in using any gift?", "rows": 2, "num": 6, "id": 3}, {"t": "f", "label": "What are some ways that you have been able to help others?", "rows": 3, "num": 7, "id": 4}, {"t": "p", "html": "Perhaps what you have listed in question #7 is a gift from the Holy Spirit. Ask yourself."}, {"t": "f", "label": "A. Am I fulfilled in this activity?", "rows": 1, "id": 5}, {"t": "f", "label": "B. Are others fulfilled by this activity?", "rows": 1, "id": 6}, {"t": "f", "label": "C. Does unity and spiritual growth result from this activity?", "rows": 1, "id": 7}, {"t": "f", "label": "D. Am I motivated by love?", "rows": 1, "id": 8}, {"t": "q", "num": 8, "label": "1 Corinthians 14:1 What should your attitude be regarding the spiritual gift?"}, {"t": "f", "label": "Have you desired to be used by God and have you earnestly desired spiritual gifts to operate in your life? Why or Why not?", "rows": 2, "num": 9, "id": 9}, {"t": "q", "num": 10, "label": "If a person is operating in supernatural gifts given by the Holy Spirit, what will result from their ministry?"}, {"t": "f", "label": "Matthew 7:17", "rows": 1, "id": 10}, {"t": "f", "label": "1 Corinthians 14:26", "rows": 1, "id": 11}, {"t": "f", "label": "1 Corinthians 14:33", "rows": 1, "id": 12}, {"t": "f", "label": "Ephesians 4:16", "rows": 1, "id": 13}]}, {"n": 23, "title": "World Vision", "ref": "Matthew 28:19-20", "verse": "Go therefore and make disciples of all the nations baptizing them in the name of the Father and the Son and the Holy Spirit, teaching them to observe all that I commanded you; and lo, I am with you always, even to the end of the age.", "blocks": [{"t": "f", "label": "How does John 3:16 show the breadth of God’s concern for men?", "rows": 3, "num": 1, "id": 0}, {"t": "q", "num": 2, "label": "In what different ways did Jesus state His “Great Commission” in these verses?"}, {"t": "f", "label": "Matthew 28:19-20", "rows": 2, "id": 1}, {"t": "f", "label": "Mark 16:15", "rows": 2, "id": 2}, {"t": "f", "label": "Luke 24:47", "rows": 2, "id": 3}, {"t": "f", "label": "John 17:18; 20-21", "rows": 2, "id": 4}, {"t": "f", "label": "Acts 1:8", "rows": 1, "id": 5}, {"t": "q", "num": 3, "label": "To whom was Jesus’ ministry directed?"}, {"t": "f", "label": "John 8:12", "rows": 1, "id": 6}, {"t": "f", "label": "Matthew 4:17", "rows": 1, "id": 7}, {"t": "f", "label": "Matthew 5:14", "rows": 1, "id": 8}, {"t": "q", "num": 4, "label": "What is promised to those who forsake all and follow Jesus?"}, {"t": "f", "label": "Matthew 4:19", "rows": 1, "id": 9}, {"t": "f", "label": "Matthew 28:20", "rows": 1, "id": 10}, {"t": "f", "label": "Mark 10:28-30", "rows": 2, "id": 11}, {"t": "q", "num": 5, "label": "What does God say about those who bring the Gospel (good news) of Jesus Christ to the unsaved people of the world?"}, {"t": "f", "label": "Romans 10:15", "rows": 1, "id": 12}, {"t": "f", "label": "Proverbs 11:30", "rows": 1, "id": 13}, {"t": "q", "num": 6, "label": "What is God’s desire for all of mankind?"}, {"t": "f", "label": "2 Peter 3:9", "rows": 1, "id": 14}, {"t": "f", "label": "1 Timothy 2:4", "rows": 1, "id": 15}, {"t": "f", "label": "Matthew 9:36-38 As Jesus looked at the tremendous needs in the world, what did He ask His disciples to pray?", "rows": 3, "num": 7, "id": 16}, {"t": "q", "num": 8, "label": "What are some other specific things you can pray, for those without Christ?"}, {"t": "f", "label": "John 6:44", "rows": 1, "id": 17}, {"t": "f", "label": "John 16:8", "rows": 1, "id": 18}, {"t": "f", "label": "2 Corinthians 7:9-10", "rows": 2, "id": 19}, {"t": "f", "label": "Ephesians 1:17-18", "rows": 1, "id": 20}, {"t": "q", "num": 9, "label": "What can you pray for yourself and others who share the gospel around the world?"}, {"t": "f", "label": "Acts 4:29-31", "rows": 1, "id": 21}, {"t": "f", "label": "Ephesians 6:19", "rows": 1, "id": 22}, {"t": "f", "label": "Colossians 4:2-3", "rows": 1, "id": 23}, {"t": "p", "html": "Many of us cannot reach other nations on our feet, but we can reach them on our knees."}, {"t": "q", "num": 10, "label": "Mark 3:13-14 What was Jesus’ plan to reach the world with the Gospel?"}, {"t": "f", "label": "", "rows": 2, "id": 24}, {"t": "q", "num": 11, "label": "2 Timothy 2:2 What instruction did the Apostle Paul give Timothy?"}, {"t": "f", "label": "", "rows": 2, "id": 25}, {"t": "p", "html": "Note: Although Jesus helped thousands of people, He closely trained only 12 men. Have you asked God to give you a person with whom you can disciple? Will you allow God to use you in His plan of spiritual multiplication?"}, {"t": "q", "num": 12, "label": "Everyone has a part in reaching the world for Christ. What are the various jobs involved with bringing in the harvest?"}, {"t": "f", "label": "1 Corinthians 3:6-7", "rows": 2, "id": 26}, {"t": "f", "label": "John 4:36-37", "rows": 2, "id": 27}, {"t": "p", "html": "In the spiritual sense, what does planting, sowing, watering, and reaping mean to you?"}, {"t": "f", "label": "", "rows": 2, "id": 28}, {"t": "q", "num": 13, "label": "What is another important way we can help spread the gospel?"}, {"t": "f", "label": "Luke 8: 1-3", "rows": 2, "id": 29}, {"t": "f", "label": "2 Corinthians 8:1-4", "rows": 2, "id": 30}, {"t": "f", "label": "1 Corinthians 16:1-3", "rows": 2, "id": 31}, {"t": "p", "html": "Do you have a plan for giving? If not, pray and ask God to guide and direct your giving. Here are some practical ways to be a part of God’s world vision:"}, {"t": "li", "html": "Use a world map and pray for countries around the world."}, {"t": "li", "html": "Learn about various mission groups and correspond with missionaries."}, {"t": "li", "html": "Be alert to your own daily contacts with nonChristians looking for opportunities to plant, water or reap."}, {"t": "li", "html": "Give financially to a missionary outreach or individual missionary."}, {"t": "li", "html": "Make discipleship a priority in your life. Impart what you have learned to other reliable people. Let God use you to reach the world."}]}, {"n": 24, "title": "The Return of Jesus Christ", "ref": "Acts 1:11", "verse": "…and they also said, Men of Galilee why do you stand looking into the sky? This Jesus who has been taken up from you into heaven, will come in just the same way as you have watched Him go into heaven.", "blocks": [{"t": "f", "label": "John 14:2-3 What did Jesus promise His disciples?", "rows": 3, "num": 1, "id": 0}, {"t": "q", "num": 2, "label": "What does Jesus say about His return in the following verses?"}, {"t": "f", "label": "Matthew 16:27", "rows": 2, "id": 1}, {"t": "f", "label": "Matthew 24:27", "rows": 2, "id": 2}, {"t": "f", "label": "Mark 13:26-27", "rows": 2, "id": 3}, {"t": "f", "label": "Luke 12:40", "rows": 2, "id": 4}, {"t": "q", "num": 3, "label": "The Apostle Paul gives more details of the Lord’s return in his first letter to the Thessalonians."}, {"t": "f", "label": "1 Thessalonians 2:19", "rows": 2, "id": 5}, {"t": "f", "label": "1 Thessalonians 3:12-13", "rows": 2, "id": 6}, {"t": "f", "label": "1 Thessalonians 4:16-18", "rows": 2, "id": 7}, {"t": "f", "label": "1 Thessalonians 5:2-6", "rows": 2, "id": 8}, {"t": "q", "num": 4, "label": "According to the following verses what are the preliminary signs that Christ’s return is near?"}, {"t": "h", "html": "Matthew Chapter 24"}, {"t": "f", "label": "Verse 5", "rows": 1, "id": 9}, {"t": "f", "label": "Verse 6", "rows": 1, "id": 10}, {"t": "f", "label": "Verse 7", "rows": 1, "id": 11}, {"t": "f", "label": "Verse 8", "rows": 1, "id": 12}, {"t": "f", "label": "Verse 10", "rows": 1, "id": 13}, {"t": "f", "label": "Verse 11", "rows": 1, "id": 14}, {"t": "f", "label": "Verse 12", "rows": 1, "id": 15}, {"t": "f", "label": "2 Timothy 3:1-5", "rows": 2, "id": 16}, {"t": "f", "label": "2 Peter 3:3-4", "rows": 2, "id": 17}, {"t": "f", "label": "Matthew 24:36 Who knows the exact day of Jesus’ return?", "rows": 2, "num": 5, "id": 18}, {"t": "f", "label": "Matthew 24:32-34 Can we know the season of His return, the generation of people that will witness this event?", "rows": 2, "num": 6, "id": 19}, {"t": "p", "html": "Note: There are two major events that will cause the physical return of Jesus Christ to the earth (1) the rapture, and (2) the great tribulation. There are many differing views about the exact order of these events. Some Bible scholars say the rapture will take place before tribulation starts; some believe it will take place half way through the tribulation, some believe it will take place at the end of tribulation."}, {"t": "h", "html": "THE RAPTURE"}, {"t": "q", "num": 7, "label": "What do the following verses tell us about this event?"}, {"t": "f", "label": "1 Thessalonians 4:13-18", "rows": 2, "id": 20}, {"t": "f", "label": "1 Corinthians 15:51-53", "rows": 2, "id": 21}, {"t": "p", "html": "The word “rapture” is not in the Bible; however, the concept of Christians being quickly snatched away from the earth to meet the Lord Jesus Christ in the air is definitely portrayed in the above verses of Scripture. In 1 Thessalonians 4:17 the word “caught” is the Greek word “harpazo” which means “to seize; catch away, up; pluck; pull.”"}, {"t": "q", "num": 8, "label": "How should we prepare for this event?"}, {"t": "f", "label": "Matthew 24:42-46", "rows": 2, "id": 22}, {"t": "f", "label": "Luke 21:34-36", "rows": 2, "id": 23}, {"t": "f", "label": "1 Thessalonians 5:4-8", "rows": 2, "id": 24}, {"t": "h", "html": "THE TRIBULATION"}, {"t": "p", "html": "This is a 7 year period of time preceding the physical return of Jesus Christ to this earth. The first 3 ½ years will be a time of false peace, and the last 3 ½ years will be a time of unbelievable disasters and affliction culminating in the last great war on earth referred to as “Armageddon.” The last 3 ½ years is also referred to as the time of “God’s wrath.” (Also read Daniel 9:24-27 and Revelation 13:5 these passages of Scripture refer to the length of time that the tribulation will take place. Reading these Scriptures in the Living Bible Translation will help you better understand the Biblical references to the number of years that are appointed for tribulation.)"}, {"t": "q", "num": 9, "label": "What do the following verses tell us about this period of time referred to as “Tribulation?”"}, {"t": "f", "label": "Matthew 24:21-22", "rows": 2, "id": 25}, {"t": "f", "label": "1 Thessalonians 5:3", "rows": 1, "id": 26}, {"t": "h", "html": "Revelation Chapter 16"}, {"t": "f", "label": "Verse 1", "rows": 1, "id": 27}, {"t": "f", "label": "Verse 2", "rows": 1, "id": 28}, {"t": "f", "label": "Verse 3", "rows": 1, "id": 29}, {"t": "f", "label": "Verse 4", "rows": 1, "id": 30}, {"t": "f", "label": "Verse 8", "rows": 1, "id": 31}, {"t": "f", "label": "Verse 10", "rows": 1, "id": 32}, {"t": "f", "label": "Verse12", "rows": 1, "id": 33}, {"t": "q", "num": 10, "label": "What will happen following Tribulation?"}, {"t": "f", "label": "Matthew 24:29-31", "rows": 1, "id": 34}, {"t": "f", "label": "Revelation 19:11-21", "rows": 2, "id": 35}, {"t": "f", "label": "2 Peter 3:10; Revelation 21:1", "rows": 2, "id": 36}, {"t": "q", "num": 11, "label": "Are Christians appointed to suffer the time of “God’s wrath?”"}, {"t": "f", "label": "1 Thessalonians 1:10", "rows": 1, "id": 37}, {"t": "f", "label": "1 Thessalonians 5:9", "rows": 1, "id": 38}, {"t": "q", "num": 12, "label": "Why will God’s wrath be poured out?"}, {"t": "f", "label": "Revelation 16:9-10", "rows": 2, "id": 39}, {"t": "f", "label": "Revelation 18:23-24", "rows": 2, "id": 40}, {"t": "f", "label": "Revelation 20:15 What will happen to all who refuse to receive Christ?", "rows": 2, "num": 13, "id": 41}, {"t": "f", "label": "Revelation 21:1-7 What is the glorious hope Christians have?", "rows": 5, "num": 14, "id": 42}, {"t": "q", "num": 15, "label": "What attitude should you have toward Christ’s return?"}, {"t": "f", "label": "2 Timothy 4:8", "rows": 1, "id": 43}, {"t": "f", "label": "James 5:7-8", "rows": 2, "id": 44}, {"t": "f", "label": "1 Peter 1:13", "rows": 1, "id": 45}, {"t": "p", "html": "A Christian should live his life as if Jesus died yesterday, was raised today, and is returning tomorrow! If Jesus returned tomorrow, would you be ready or would you be ashamed at what He would find you doing? Heed the warning of Scripture be alert and ready for He is coming soon!"}, {"t": "p", "html": "Matthew 24:31 “And He will send forth His angels with a great trumpet and they will gather together His elect from the four winds, from one end of the sky to the other.”"}, {"t": "p", "html": "Praise God, you made it! I pray that you have learned more about your Heavenly Father and how much He loves you and that He has a plan and purpose for your life."}, {"t": "p", "html": "~ Carolyn Evans, Isaiah 42:16 Ministries"}]}];

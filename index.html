.hero-art{width:min(88%,560px);margin:0 auto;aspect-ratio:700/262}
.hero-top{background:#FFFFFF;padding:28px 0}
.lesson-banner{max-width:720px;margin:0 auto;background-color:#FFFFFF;background-origin:content-box;padding:18px 24px;height:clamp(110px,24vw,170px);border-bottom:1px solid var(--line);border-radius:0 0 18px 18px}


.hero{background:linear-gradient(180deg,#2A2621, var(--night));color:#F5F2EC;padding:28px 0 40px;position:relative;overflow:hidden}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6.5vw,42px);line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
.hero .from{font-size:15px;color:#D6CFC3;margin:0 0 22px}
.hero blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;color:var(--lamp-soft);max-width:34em}
.hero cite{display:block;font-style:normal;font-family:var(--sans);font-size:14px;color:#B7AD9D;margin-top:6px}
.namebox{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.namebox label{font-size:15px;color:#D6CFC3}
.namebox input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px;color:#fff;min-width:0;flex:1 1 200px;max-width:320px}
.progress-line{margin-top:22px;font-size:15px;color:#D6CFC3}
.progress-line strong{color:var(--lamp)}

.trail-wrap{position:relative;padding:36px 0 24px}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trail-svg path{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.trail-svg path.lit{stroke:var(--lamp);stroke-dasharray:none;stroke-width:3}
.trail{list-style:none;margin:0;padding:0;position:relative}
.stop{display:flex;align-items:center;gap:14px;padding:6px 0;margin-left:var(--x,0);width:max-content;max-width:calc(100% - var(--x,0px))}
.stop a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;padding:6px 10px 6px 0;border-radius:10px}
.stop a:hover .title{text-decoration:underline;text-underline-offset:3px}
.stone{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:18px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.stop.started .stone{border-color:var(--lamp);color:var(--ink)}
.stop.done .stone{background:var(--lamp);border-color:var(--lamp);color:#2A2112;box-shadow:0 0 0 6px color-mix(in srgb,var(--lamp) 25%,transparent),0 0 18px color-mix(in srgb,var(--lamp) 45%,transparent)}
.stop.next .stone{border-color:var(--juniper);border-width:3px;color:var(--ink)}
.stop .title{font-family:var(--serif);font-size:18px;line-height:1.25;display:block}
.stop .meta{font-size:14px;color:var(--muted)}
.finish{font-family:var(--serif);font-style:italic;color:var(--muted);text-align:center;margin:28px auto 8px;max-width:30em}
.foot{font-size:14px;color:var(--muted);padding:24px 0 40px;border-top:1px solid var(--line);margin-top:24px}
.foot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* Lesson */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.back{background:none;border:0;cursor:pointer;font-weight:600;color:var(--juniper);padding:8px 4px;display:flex;align-items:center;gap:6px}
.status{font-size:14px;color:var(--muted);text-align:right}
.lesson-head{padding:32px 0 8px}
.lesson-head .num{font-size:15px;color:var(--muted);margin:0 0 6px}
.lesson-head h2{font-family:var(--serif);font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0}
.verse{background:linear-gradient(160deg,var(--night-2),var(--night));color:#F1EEE6;border-radius:14px;padding:22px 22px 20px;margin:22px 0 28px;border-left:5px solid var(--lamp)}
.verse .lab{font-size:14px;color:#B7AD9D;margin:0 0 8px}
.verse p{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0}
.verse .ref{font-family:var(--sans);font-weight:600;color:var(--lamp);font-size:15px;margin-top:10px}
.verse .mvl{display:block;margin-top:16px;font-size:15px;color:#D6CFC3}
.verse summary{cursor:pointer;color:#D6CFC3}
.verse textarea{margin-top:8px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#fff}

.body p.t{font-family:var(--serif);line-height:1.7;margin:18px 0}
.body h3{font-family:var(--serif);font-size:20px;margin:34px 0 8px}
.body ul{font-family:var(--serif);line-height:1.7;padding-left:22px;margin:12px 0}
.body ul li{margin:6px 0}
.q{margin:30px 0 8px}
.q .qh{display:flex;gap:12px;align-items:baseline}
.q .n{flex:none;font-family:var(--serif);font-weight:700;color:var(--juniper);font-size:19px;min-width:1.6em}
.q .ql{font-family:var(--serif);font-size:18px;line-height:1.55;font-weight:600}
.f{margin:10px 0 12px}
.f.sub{padding-left:calc(1.6em + 12px)}
.f .fl{display:block;font-family:var(--serif);font-size:17px;line-height:1.5;margin-bottom:6px}
.f.sub .fl{font-weight:600}
.f.q .fl{display:none}
textarea{width:100%;display:block;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;line-height:1.5;resize:none;overflow:hidden;min-height:46px;transition:border-color .15s}
textarea:focus{border-color:var(--juniper);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--juniper) 25%,transparent)}
.f.q textarea{margin-left:calc(1.6em + 12px);width:calc(100% - 1.6em - 12px);margin-top:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 10px;cursor:pointer;font-size:16px}
.checks input{width:18px;height:18px;accent-color:var(--juniper)}
.checks label:has(input:checked){border-color:var(--juniper);background:color-mix(in srgb,var(--juniper) 12%,var(--surface))}
.end{margin:44px 0 24px;padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.end p{margin:0 0 16px;font-family:var(--serif)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;border:2px solid var(--juniper);background:var(--juniper);color:var(--juniper-ink)}
.btn.ghost{background:transparent;color:var(--juniper)}
.pn{display:flex;justify-content:space-between;gap:12px;margin:18px 0 48px}
.pn .btn{flex:1 1 0;min-width:0}
.pn .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{transition:opacity .3s}

/* Send flow */
.page{padding-top:28px;padding-bottom:56px}
.page h2{font-family:var(--serif);font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0 0 10px}
.page .lede{font-family:var(--serif);color:var(--muted);margin:0 0 22px;line-height:1.6}
.pick{list-style:none;padding:0;margin:0 0 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.pick li+li{border-top:1px solid var(--line)}
.pick label{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--juniper);flex:none}
.pick .pm{font-size:14px;color:var(--muted);display:block}
.pick .pt{font-family:var(--serif)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.form label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
.form label .opt{font-weight:400;color:var(--muted)}
.form input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px}
.form input:focus{border-color:var(--juniper);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--juniper) 25%,transparent)}
.form input[aria-invalid="true"]{border-color:#B3261E}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:10px}
.grid3 label{margin-top:16px}
.err{color:#B3261E;font-size:15px;margin:12px 0 0;min-height:1.2em}
:root[data-theme="dark"] .err{color:#FF9C94}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FF9C94}}
.preview{width:100%;min-height:220px;max-height:340px;overflow:auto;resize:vertical;font-family:var(--sans);font-size:15px;white-space:pre-wrap}
.sendto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:15px;line-height:1.6}
.sendto b{font-weight:600}
.hint{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.btn.wide{width:100%}
.homeactions{display:flex;justify-content:center;margin:4px 0 0}
.endrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Required answers */
textarea.missing,.checks.missing{border-color:#B3261E;box-shadow:0 0 0 3px rgba(179,38,30,.15)}
.checks.missing{border:1px solid #B3261E;border-radius:14px;padding:8px}
.need{background:var(--surface);border:1px solid #B3261E;border-radius:14px;padding:18px 18px 8px;margin:0 0 20px}
.need h3{font-family:var(--serif);font-size:20px;margin:0 0 6px}
.need p{margin:0 0 12px;line-height:1.5}
.need ul{list-style:none;padding:0;margin:0 0 10px}
.need li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.need li a{font-weight:600;color:var(--juniper)}
.steps{list-style:none;padding:0;margin:0 0 14px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 56px;margin:0 0 10px;position:relative;display:grid;gap:4px}
.steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--juniper);color:var(--juniper-ink);display:grid;place-items:center;font-weight:600;font-size:15px}
.steps .sl{font-size:14px;color:var(--muted)}
.steps .sv{font-family:var(--serif);overflow-wrap:anywhere}
.steps .btn{justify-self:start;margin-top:6px;padding:9px 16px}
.alt{margin:18px 0 0}
.alt summary{cursor:pointer;color:var(--juniper);font-weight:600;padding:8px 0}
.alt .steps{margin-top:10px}
.btn[disabled]{opacity:.6;cursor:progress}
/* Celebration */
.celebrate-logo{width:min(80%,340px);aspect-ratio:700/262;margin:0 auto 28px;background-color:#fff;border-radius:14px;background-origin:content-box;padding:12px 16px;box-sizing:content-box}
.celebrate{background:linear-gradient(180deg,#3A332A,#12110F);min-height:100vh;min-height:100dvh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background-position:center 30%;overflow:hidden}
.celebrate::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 40%,rgba(27,25,22,.55),rgba(18,17,15,.95))}
.celebrate .inner{position:relative;z-index:2;padding:40px 22px;width:100%;max-width:620px}
.celebrate h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,8.6vw,72px);line-height:1;margin:0 0 10px;color:var(--lamp);letter-spacing:.01em;text-shadow:0 0 30px rgba(185,138,62,.55)}
.celebrate .did{font-family:var(--serif);font-size:clamp(26px,7vw,40px);margin:0 0 24px}
.celebrate .note{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;color:#EFE6D6;margin:0 0 8px}
.celebrate .sig{font-size:15px;color:#C8BBA5;margin:0 0 28px}
.celebrate .reward{font-size:17px;line-height:1.55;margin:0 0 26px;color:#F5F2EC}
.celebrate .btn{background:var(--lamp);border-color:var(--lamp);color:#1B1916;font-size:18px;padding:14px 26px}
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.celebrate h1{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.celebrate h1{animation:none}}

@media (max-width:520px){
  .grid3{grid-template-columns:1fr 1fr}.grid3 .city{grid-column:1/-1}
  body{font-size:16px}
  .f.sub{padding-left:0}
  .f.q textarea{margin-left:0;width:100%}
  .stop .title{font-size:17px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.bar,.pn,.end .btn,.foot{display:none}.verse{background:none;color:inherit;border:1px solid #999}textarea{border:1px solid #999}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LESSONS = [{"n": 1, "title": "Assurance of Salvation", "ref": "1 John 5:11-12", "verse": "And this is the testimony: God has given us eternal life, and this life is in His Son. He who has the Son has life; he who does not have the Son of God does not have life.", "blocks": [{"t": "f", "label": "According to 1 John 5:11-12, where is eternal life found?", "rows": 2, "num": 1, "id": 0}, {"t": "f", "label": "Who has eternal life?", "rows": 2, "num": 2, "id": 1}, {"t": "f", "label": "Who does not have eternal life?", "rows": 2, "num": 3, "id": 2}, {"t": "p", "html": "On the basis of this “testimony,” God’s Word, you can be fully assured that you have eternal life through faith in God’s Son, Jesus Christ. The enemy, Satan, will try to cast doubt on your salvation. Your response to this attack should be God’s Word on the subject, not your feelings! Feelings will change, but God’s Word will never change."}, {"t": "f", "label": "John 20:31. Why did the Apostle John write this book?", "rows": 3, "num": 4, "id": 3}, {"t": "f", "label": "1 John 4:9-10; Romans 5:8. How has God shown that He loves you?", "rows": 3, "num": 5, "id": 4}, {"t": "f", "label": "Isaiah 59:2; Romans 3:23; 6:23. List the results of man’s sinfulness.", "rows": 3, "num": 6, "id": 5}, {"t": "f", "label": "Ephesians 2:8-9. Why do human efforts (our good works) fail to reach God?", "rows": 3, "num": 7, "id": 6}, {"t": "q", "num": 8, "label": "Romans 3:20; Galatians 3:24. If it is impossible to get into heaven by doing good works and keeping the commandments, then why did God give us the “law” or the “commandments?”"}, {"t": "f", "label": "", "rows": 3, "id": 7}, {"t": "f", "label": "John 6:28-29. The Jews wanted to know what they had to “do” in order to please God. What was Jesus’ response?", "rows": 2, "num": 9, "id": 8}, {"t": "q", "num": 10, "label": "1 Peter 3:18. How did Peter explain what God has done to bring men to Himself?"}, {"t": "f", "label": "", "rows": 3, "id": 9}, {"t": "f", "label": "John 1:12-13. How is one “born” into God’s Family?", "rows": 3, "num": 11, "id": 10}, {"t": "f", "label": "2 Corinthians 5:17. What takes place when you become a Christian?", "rows": 3, "num": 12, "id": 11}, {"t": "q", "num": 13, "label": "Which of the following have you experienced since you became a Christian?"}, {"t": "check", "items": ["Inner Peace", "New Awareness of Sin", "Victory over sin", "Desire to read the Bible", "New love for God", "Attitude changes", "Sense of Forgiveness", "New concern for others"], "id": 12}, {"t": "p", "html": "Note: If you have not experienced any of the above changes, you may not have received Christ into your life yet. There is a difference between knowing about Jesus and knowing Jesus. Have you experienced an awareness of your own sinfulness yet? (Read 1 John 1:8,10). This awareness should lead you to Christ asking His forgiveness and inviting Him to come into your life. If you have not done this, please take time right now to pray this simple prayer: “Dear Lord Jesus, I am a sinner. I believe You died on the cross to pay for my sins. I believe you arose from the dead and are alive. I ask You to forgive me of my sins and wash me clean. Lord Jesus, I now give you control of my life. Take my life and make of it what you want. Thank You for giving me the gift of eternal life.”"}, {"t": "f", "label": "Matthew 28:20; John 10:27-29. What does Jesus promise His followers?", "rows": 4, "num": 14, "id": 13}, {"t": "f", "label": "Romans 8:15-17. List some of the advantages of being a true child of God.", "rows": 4, "num": 15, "id": 14}, {"t": "f", "label": "John 5:24. What was your condition before you received Christ?", "rows": 4, "num": 16, "id": 15}, {"t": "f", "label": "What is your condition now?", "rows": 3, "id": 16}, {"t": "p", "html": "The One thing you absolutely need is the One thing you can never lose."}, {"t": "p", "html": "<strong>His Presence<\/strong>"}]}, {"n": 2, "title": "Assurance of Forgiveness", "ref": "1 John 1:9", "verse": "If we confess our sins, He is faithful and just and will forgive us our sins and purify us from all unrighteousness.", "blocks": [{"t": "p", "html": "Although you are now a Christian, there may be times when you fail and sin. The literal definition to sin is “to miss the mark.” Once you sin, your enemy Satan will be quick to brow beat you and condemn you. He is unmerciful! You must be quick to act on God’s Word and confess your sin expecting full forgiveness from God. This will shut the door to the voice of the “accuser.” (Read Revelation 12:10)"}, {"t": "p", "html": "1 John 1:9 is the Christian’s bar of soap, so to speak!"}, {"t": "f", "label": "1 John 1:9. What does “confess” mean to you?", "rows": 2, "num": 1, "id": 0}, {"t": "f", "label": "Websters: admit, tell sins", "rows": 1, "id": 1}, {"t": "q", "num": 2, "label": "The above verse describes God as “faithful” and “just.” Give definitions of these attributes of God."}, {"t": "f", "label": "Faithful", "rows": 1, "id": 2}, {"t": "f", "label": "Just", "rows": 1, "id": 3}, {"t": "f", "label": "What is the result of confessing your sin to God?", "rows": 2, "num": 3, "id": 4}, {"t": "f", "label": "Give your own explanation of “purify”", "rows": 1, "id": 5}, {"t": "f", "label": "Proverbs 28:13. What is another result of confession?", "rows": 2, "num": 4, "id": 6}, {"t": "f", "label": "What should accompany the confession of sin?", "rows": 1, "id": 7}, {"t": "p", "html": "What will result from hiding your sin? No spiritual progress"}, {"t": "q", "num": 5, "label": "How is God described in the following verses?"}, {"t": "f", "label": "Psalms 86:5", "rows": 1, "id": 8}, {"t": "f", "label": "Isaiah 43:25", "rows": 1, "id": 9}, {"t": "f", "label": "Does this agree with your view of God?", "rows": 1, "id": 10}, {"t": "f", "label": "Why or why not?", "rows": 2, "id": 11}, {"t": "p", "html": "Note: Please do not rush through this question. If you have difficulty accepting God’s forgiveness, you need to examine your preconceived ideas concerning God. God wants you to know the truth about Him. Have you grown up in a strict household or church that always held your mistakes over your head? Were you severely punished or criticized for minor failures? Were you led to believe that someone was always “keeping a list and checking it twice” of every bad thing you ever did? Is it possible that you view God in the same way you view authority figures in your life? If so, take time right now to forgive the people who misrepresented God’s character to you and ask God to forgive you for believing a lie about Him."}, {"t": "f", "label": "Ephesians 1:7. On what basis are you forgiven?", "rows": 4, "num": 6, "id": 12}, {"t": "f", "label": "Hebrews 10:17; Psalms 32:5. Why is it foolish to continue to feel guilty about your sin?", "rows": 4, "num": 7, "id": 13}, {"t": "q", "num": 8, "label": "Matthew 18:21-35; 1 Corinthians 13:5; Ephesians 4:32. Now that you have been forgiven of your sins, how should you treat other people who have sinned against you?"}, {"t": "f", "label": "", "rows": 3, "id": 14}, {"t": "p", "html": "Take time now to pray and forgive those who have sinned against you. Let go of all your “records” of their sins, just as God has destroyed all records of your sins! “Love keeps no record of wrong.” (Read 1 Corinthians 13:5)"}, {"t": "p", "html": "<em>Thank you Jesus for destroying all records of my sins. Help <strong>Me<\/strong> to grant the same Mercy and Grace to others.<\/em>"}]}, {"n": 3, "title": "The Holy Spirit", "ref": "Zechariah 4:6", "verse": "Not by might nor by power, but by My Spirit, says the Lord of Hosts.", "blocks": [{"t": "f", "label": "Zechariah 4:6 What does “not by might nor by power” mean to you?", "rows": 3, "num": 1, "id": 0}, {"t": "f", "label": "What does “by my Spirit” mean to you?", "rows": 2, "id": 1}, {"t": "p", "html": "Also read Psalms 118:8; 33:16-20; 44:4-7; 60:11-12"}, {"t": "f", "label": "Do you rely upon the Holy Spirit to accomplish changes in your life, to accomplish God’s work, for protection, or do you rely upon your own strength? Why or why not?", "rows": 2, "id": 2}, {"t": "q", "num": 2, "label": "What is true of every believer?"}, {"t": "f", "label": "Romans 8:9", "rows": 1, "id": 3}, {"t": "f", "label": "1 Corinthians 2:12", "rows": 1, "id": 4}, {"t": "f", "label": "1 Corinthians 3:16", "rows": 1, "id": 5}, {"t": "f", "label": "2 Timothy 1:7 What are some results of the Holy Spirit’s presence in the life of the believer?", "rows": 2, "num": 3, "id": 6}, {"t": "q", "num": 4, "label": "What activities or characteristics of the Holy Spirit are mentioned in the following verses?"}, {"t": "f", "label": "1 Corinthians 2:10", "rows": 1, "id": 7}, {"t": "f", "label": "1 Corinthians 2:12-13", "rows": 1, "id": 8}, {"t": "f", "label": "1 Corinthians 12:4-11", "rows": 1, "id": 9}, {"t": "f", "label": "John 15:26", "rows": 1, "id": 10}, {"t": "f", "label": "John 16:8", "rows": 1, "id": 11}, {"t": "q", "num": 5, "label": "What indications are there in the following verses that the Holy Spirit is God?"}, {"t": "f", "label": "Genesis 1:2", "rows": 1, "id": 12}, {"t": "f", "label": "Hebrews 9:14", "rows": 1, "id": 13}, {"t": "f", "label": "Psalms 139:7", "rows": 1, "id": 14}, {"t": "f", "label": "Acts 5:3-4", "rows": 1, "id": 15}, {"t": "q", "num": 6, "label": "In the following verses what activities of the Holy Spirit indicate that He is a person, not just an influence?"}, {"t": "f", "label": "Acts 13:2", "rows": 1, "id": 16}, {"t": "f", "label": "John 14:26", "rows": 1, "id": 17}, {"t": "f", "label": "John 16:13", "rows": 1, "id": 18}, {"t": "f", "label": "Romans 8:26", "rows": 1, "id": 19}, {"t": "f", "label": "Ephesians 4:30", "rows": 1, "id": 20}, {"t": "f", "label": "Ephesians 4:29-31 What grieves the Holy Spirit?", "rows": 3, "num": 7, "id": 21}, {"t": "f", "label": "Is there anything in your life right now that grieves the Holy Spirit?", "rows": 1, "id": 22}, {"t": "f", "label": "If so, what steps do you need to take in order to be in right relationship with the Lord and others? Read Ephesians 4:32 and 1 John 1:9", "rows": 2, "id": 23}, {"t": "q", "num": 8, "label": "Romans 8 describes a victorious Christian life. How does the Holy Spirit help you to live in victory?"}, {"t": "f", "label": "Verse2", "rows": 1, "id": 24}, {"t": "f", "label": "Verse 14", "rows": 1, "id": 25}, {"t": "f", "label": "Verse 26-27", "rows": 1, "id": 26}, {"t": "f", "label": "Acts 1:5,8 Jesus used the expression “you will” 3 times. He made these statements in conjunction with the Holy Spirit. What three statements did He make?", "rows": 3, "num": 9, "id": 27}, {"t": "f", "label": "Acts 2:1-4; 4:31-33; 6:5.8 What happened when the disciples were filled with the Holy Spirit?", "rows": 3, "num": 10, "id": 28}, {"t": "f", "label": "Luke 11:11-13 This story illustrates God the Father’s desire to give His children good gifts. What does God want to give you?", "rows": 2, "num": 11, "id": 29}, {"t": "f", "label": "Does this indicate that there is more for you to experience concerning the Holy Spirit?", "rows": 2, "id": 30}, {"t": "p", "html": "The question is, does the Holy Spirit have all of you? Have you yielded yourself to His control? He is a gentleman and will not override your will. To be filled with the Holy Spirit is to be Spirit possessed, Spirit led, Spirit empowered, and Spirit controlled. Is it your desire to be filled with the Holy Spirit? If so, stop and pray right now asking God to fill you with the Holy Spirit. In prayer of commitment give up all control over your life and yield yourself to His control giving Him your talents, gifts, time, money, possessions, and tongue. Your life will begin to change to the glory of God!"}]}, {"n": 4, "title": "Spiritual Warfare", "ref": "Ephesians 6:12", "verse": "For our struggle is not against flesh and blood, but against the rulers, against the powers, against the world forces of wickedness in the heavenly places.", "blocks": [{"t": "f", "label": "Ephesians 6:12 Who is NOT our enemy?", "rows": 2, "num": 1, "id": 0}, {"t": "f", "label": "Who is the enemy?", "rows": 1, "id": 1}, {"t": "f", "label": "2 Timothy 2:3-4 To what does the Apostle Paul compare the Christian?", "rows": 2, "num": 2, "id": 2}, {"t": "q", "num": 3, "label": "If a soldier wants to win a battle, he must know who the enemy is and how he operates. From the following Scriptures give each name of the enemy and his method of operation."}, {"t": "f", "label": "Genesis 3:1-5", "rows": 1, "id": 3}, {"t": "f", "label": "Matthew 4:1-3", "rows": 1, "id": 4}, {"t": "f", "label": "Luke 8:12", "rows": 1, "id": 5}, {"t": "f", "label": "John 8:44", "rows": 1, "id": 6}, {"t": "f", "label": "2 Corinthians 2:11", "rows": 1, "id": 7}, {"t": "f", "label": "2 Corinthians 4:3-4", "rows": 1, "id": 8}, {"t": "f", "label": "2 Corinthians 11:14", "rows": 1, "id": 9}, {"t": "f", "label": "1 Peter 5:8-9", "rows": 1, "id": 10}, {"t": "f", "label": "Revelation 12:9-10", "rows": 1, "id": 11}, {"t": "q", "num": 4, "label": "What did Jesus already do that secured victory for us?"}, {"t": "f", "label": "Hebrews 2:14-15", "rows": 1, "id": 12}, {"t": "f", "label": "Colossians 2:14-15", "rows": 1, "id": 13}, {"t": "f", "label": "Revelation 12:10-11", "rows": 1, "id": 14}, {"t": "q", "num": 5, "label": "What is the basis for the victory from the following verses?"}, {"t": "f", "label": "1 John 2:14", "rows": 1, "id": 15}, {"t": "f", "label": "1 John 4:4", "rows": 1, "id": 16}, {"t": "f", "label": "1 John 5:4-5", "rows": 1, "id": 17}, {"t": "f", "label": "Revelation 12:11 List 3 factors that give victory over Satan and why you think each one is important.", "rows": 3, "num": 6, "id": 18}, {"t": "q", "num": 7, "label": "What authority did Jesus give His followers?"}, {"t": "f", "label": "Matthew 16:18-19", "rows": 1, "id": 19}, {"t": "f", "label": "Mark 3:27", "rows": 1, "id": 20}, {"t": "f", "label": "Mark 16:17", "rows": 1, "id": 21}, {"t": "f", "label": "Luke 10:17-20", "rows": 2, "id": 22}, {"t": "f", "label": "Revelation 20:10 What will be the final destination for Satan and his followers?", "rows": 3, "num": 8, "id": 23}, {"t": "q", "num": 9, "label": "From Ephesians 6:14-18 list the spiritual armor that we must wear and some practical steps to help you use each item daily."}, {"t": "h", "html": "EQUIPMENT PRACTICAL STEPS"}, {"t": "f", "label": "", "rows": 7, "id": 24}, {"t": "p", "html": "As you put this spiritual armor on each day you will grow in your confidence as a victorious Christian. Each piece of armor represents something Christ has done for you or in you. Acknowledge it and accept it by faith. This lets the enemy know that you are trusting in Christ and not yourself."}, {"t": "q", "num": 10, "label": "Now that you are a soldier who is trained and equipped, what are your marching orders?"}, {"t": "f", "label": "Ephesians 6:18", "rows": 1, "id": 25}, {"t": "f", "label": "1 Thessalonians 5:8", "rows": 1, "id": 26}, {"t": "f", "label": "1 Peter 4:7", "rows": 1, "id": 27}, {"t": "f", "label": "Jude 23", "rows": 1, "id": 28}, {"t": "h", "html": "POINTS TO REMEMBER"}, {"t": "li", "html": "We are Christ’s representatives here on earth, and He has given us authority over Satan and his demons. Christ has equipped us with His Word, His Spirit, His Armor, and has promised us victory!"}, {"t": "li", "html": "Should Satan become more prominent in our eyes than Christ, we can rest assured that our focus has gotten off track. Jesus must be your focus! God does not want us to be ignorant of Satan’s devices since Satan is still roaming the earth deceiving mankind until his final judgment day when he is cast into the lake of fire. But God also wants us to know that Jesus has already secured the victory over Satan and made provision for us to enforce that victory here on earth."}, {"t": "li", "html": "Satan loves to be in the “headlines!” The more you give him headline attention, the more he’ll manifest. So be sure to give Jesus the headlines and Satan the “fine print.” You need to know enough to deal effectively with the enemy, but keep it in perspective Satan is not bigger or more powerful than Jesus."}, {"t": "p", "html": "Put on the Armor and pray. Make it a habit to enforce the victory Jesus already won for you!"}]}, {"n": 5, "title": "God Created You And He Loves You", "ref": "Jeremiah 1:5", "verse": "Before I formed you in the womb, I knew you, and before you were born, I consecrated you.", "blocks": [{"t": "p", "html": "You are a very special person. God cherishes you like a mother cherishes her newborn baby, only more so! He knows everything about you and cares what happens to you."}, {"t": "f", "label": "Genesis 1:26-31 List at least 3 facts concerning God’s creation of man.", "rows": 3, "num": 1, "id": 0}, {"t": "f", "label": "Genesis 1:26-28 God gave you dignity as shown by the fact that He created you in His own image! How does this make you feel about yourself?", "rows": 2, "num": 2, "id": 1}, {"t": "f", "label": "Jeremiah 1:5 Did God know Jeremiah before he was born? Did He have a plan for Jeremiah’s life before he was born?", "rows": 2, "num": 3, "id": 2}, {"t": "f", "label": "Psalms 139:1-6; Matthew 10:29-31 God knows you in a very personal way. List some of the areas of your life He has searched and known:", "rows": 3, "num": 4, "id": 3}, {"t": "f", "label": "Psalms 139:13-16 Did God plan your birth?", "rows": 3, "num": 5, "id": 4}, {"t": "f", "label": "Has Satan told you that you were unplanned? If that thought ever harasses you again, resist it with Gods Word. Will you believe Satan’s lies or God’s Word?", "rows": 1, "id": 5}, {"t": "f", "label": "Galatians 3:28 Does God have favorites? Does He show any partiality between people groups, genders or positions?", "rows": 2, "num": 6, "id": 6}, {"t": "f", "label": "How does God view you?", "rows": 1, "id": 7}, {"t": "f", "label": "Note: We are all equal at the foot of the cross...all loved the same...no favorites. Isn’t that great news?", "rows": 2, "id": 8}, {"t": "q", "num": 7, "label": "The following men and women of God were designed with very special and unique qualities. List at least one thing about each person that encourages you or helps you see how God can use each person, as different as they are from one another, in such special ways."}, {"t": "f", "label": "Gideon (Judges 6:11-40)", "rows": 2, "id": 9}, {"t": "f", "label": "David (1Samuel 16:1-13; Acts 13:22)", "rows": 2, "id": 10}, {"t": "f", "label": "Rahab (Joshua 2:1-24; Matthew 1:5; Hebrews 11:31)", "rows": 2, "id": 11}, {"t": "f", "label": "Ruth (Ruth 1:1-22; 2:1-16; Matthew 1:5)", "rows": 2, "id": 12}, {"t": "f", "label": "Stephen (Acts 6:2-15; 7:51-60)", "rows": 1, "id": 13}, {"t": "f", "label": "Deborah (Judges 4:4-14)", "rows": 2, "id": 14}, {"t": "p", "html": "Like the people you just read about, God also has a plan for your life. He created you purposefully, giving you special talents, qualities, gifts, and a unique personality so you could fulfill His purpose for your life!"}, {"t": "f", "label": "Isaiah 49:15-16 To what relationship does God compare His love for you?", "rows": 3, "num": 8, "id": 15}, {"t": "f", "label": "Are you able to relate to the picture that is painted in this Scripture?", "rows": 1, "id": 16}, {"t": "f", "label": "Why or why not?", "rows": 2, "id": 17}, {"t": "f", "label": "Does this passage of Scripture indicate that a human parent might fail and fall short of God’s best?", "rows": 2, "id": 18}, {"t": "f", "label": "Numbers 23:19 Is God like a human parent? Does He fail and fall short?", "rows": 2, "num": 9, "id": 19}, {"t": "p", "html": "Have your parents ever forgotten or broken a promise to you?"}, {"t": "p", "html": "According to God’s Word, will God forget you or break His promises to you?"}, {"t": "p", "html": "Does this knowledge give you a new sense of security and well-being?"}, {"t": "p", "html": "Take time right now to thank God for creating you. Ask Him to forgive you if you thought He made a mistake in your creation. Repent if you have rejected yourself, hated yourself, or viewed yourself as worthless. Accept yourself as God has already accepted you."}, {"t": "p", "html": "God created you for a purpose, you have a destiny."}, {"t": "p", "html": "God gave the keys of authority and dominion to Adam. Adam gave them to Satan. Jesus came and died on the cross and took the keys back and gave them to you. Now what are you going to do with them?"}]}, {"n": 6, "title": "The Deity And Humanity Of Jesus Christ", "ref": "Hebrews 1:2", "verse": "In these last days (God) has spoken to us in His Son, whom He appointed heir of all things, through whom also He made the world.", "blocks": [{"t": "p", "html": "Some people say Jesus was a prophet, a great teacher, an angel, or just a good man; but Jesus claimed to be God! The following lesson will show that Jesus Christ is God in human flesh. This is the key difference between Christianity and all of the “religious cults.” Christianity declares that Jesus is God and the cults do not."}, {"t": "h", "html": "The Deity of Jesus Christ"}, {"t": "f", "label": "Hebrews 1:1-14 Verses 1-6, 13-14. Jesus’ superiority to the angels is shown by:", "rows": 3, "num": 1, "id": 0}, {"t": "f", "label": "Verses 8-10 How does God address Jesus?", "rows": 1, "id": 1}, {"t": "f", "label": "Hebrews 1:2; Colossians 1:15-17 If only God can create (read Genesis 1:1), then what conclusion do you come to concerning Jesus?", "rows": 2, "num": 2, "id": 2}, {"t": "f", "label": "John 10:28-30 What did Jesus claim for Himself?", "rows": 3, "num": 3, "id": 3}, {"t": "q", "num": 4, "label": "John 20:24-29 What was Thomas’ confession when he saw the resurrected Christ?"}, {"t": "f", "label": "", "rows": 2, "id": 4}, {"t": "f", "label": "If Jesus was only a prophet or created angel, would He have accepted Thomas’ worship? (Read Acts 10:25-26; Acts 14:11-15; Revelations 22:8-9)", "rows": 2, "id": 5}, {"t": "f", "label": "John 8:57-59; 10:33 What did Jesus say concerning Himself that caused the Jews to try to stone Him?", "rows": 2, "num": 5, "id": 6}, {"t": "f", "label": "Exodus 3:14 By what name did God reveal Himself to Moses?", "rows": 2, "num": 6, "id": 7}, {"t": "f", "label": "Revelation 22:13 How does Jesus refer to Himself?", "rows": 2, "num": 7, "id": 8}, {"t": "f", "label": "Isaiah 41:4; 48:12. How does God refer to Himself?", "rows": 2, "num": 8, "id": 9}, {"t": "f", "label": "What conclusions can you draw from these Scriptures?", "rows": 2, "num": 9, "id": 10}, {"t": "f", "label": "Read the list of fulfilled prophecies concerning Christ. (Isaiah 9:7=Matthew 1:1; Isaiah 7:14=Matthew 1:22-23; Micah 5:2=Matthew 2:1; Zechariah 9:9=Mark 11:7; Psalm 22:18=Mark 15:24; Isaiah 53:12=Mark 15:27; Psalm 16:10=Mark 16:6) How do the prophecies about Christ influence your concept of who Jesus is?", "rows": 2, "num": 10, "id": 11}, {"t": "h", "html": "The Humanity of Jesus Christ"}, {"t": "q", "num": 1, "label": "Hebrews 2:9-18 Write out the verse that backs up the following statements."}, {"t": "f", "label": "A. Jesus suffered and experienced death.", "rows": 2, "id": 12}, {"t": "f", "label": "B. Jesus calls us brethren thus identifying himself with mankind.", "rows": 2, "id": 13}, {"t": "f", "label": "C. Jesus was tempted like all men are tempted.", "rows": 2, "id": 14}, {"t": "q", "num": 2, "label": "Matthew 4:1-11 In what three ways was Jesus tempted?"}, {"t": "f", "label": "Verse 3", "rows": 1, "id": 15}, {"t": "f", "label": "Verse 6", "rows": 1, "id": 16}, {"t": "f", "label": "Verse 8-9", "rows": 1, "id": 17}, {"t": "f", "label": "How did Jesus resist the temptations?", "rows": 1, "id": 18}, {"t": "f", "label": "What is a temptation you often face?", "rows": 2, "num": 3, "id": 19}, {"t": "f", "label": "What can you do the next time Satan offers this temptation?", "rows": 1, "id": 20}, {"t": "p", "html": "Find a Scripture that will help you resist the enemy. Write it out and memorize it."}, {"t": "f", "label": "", "rows": 3, "id": 21}, {"t": "f", "label": "Matthew 4:2 Jesus was", "rows": 1, "id": 22}, {"t": "f", "label": "John 19:28 Jesus was", "rows": 1, "id": 23}, {"t": "f", "label": "John 4:6 Jesus was", "rows": 1, "id": 24}, {"t": "f", "label": "John 11:35 Jesus", "rows": 1, "id": 25}, {"t": "f", "label": "John Verse 1 Who is the “Word” in this verse?", "rows": 2, "num": 5, "id": 26}, {"t": "f", "label": "Verse 14, and also Revelation 19:13. Who is the “Word” in these verses?", "rows": 1, "id": 27}, {"t": "p", "html": "In summary, Jesus is God in human flesh. Christianity is not a religion, it is a person, His name is Jesus. Religion is man trying to reach God. Christianity is God becoming a man so He can bring mankind to Himself."}, {"t": "h", "html": "Prophecies Concerning the Messiah, Jesus Christ"}, {"t": "p", "html": "Fulfilled prophecy helps verify the fact that Jesus is the Christ, the Son of God. Looking at prophecies which God spoke hundreds of years before Christ’s birth and seeing how Jesus fulfilled them in every detail reveals the authenticity of God’s Word and the claims of Christ."}, {"t": "p", "html": "Note of Interest: Mathematicians have estimated, according to the “Law of Compound Probabilities,” that if a prophecy concerning a person, place, or event has 25 details beyond the possibility of human collusion, calculation, coincidence, and comprehension, there is only one chance in more than 33 ½ million of its accidental fulfillment. 25 details concerning the betrayal, trial, death, and burial of Jesus were fulfilled within a 24-hour period!"}, {"t": "p", "html": "2 Timothy 3:16 “All Scriptures is inspired by God and profitable for teaching, reproof, for correction, for training in righteousness.”"}, {"t": "p", "html": "2 Peter 1:21 “For no prophecy was ever made by an act of human will, but men moved by the Holy Spirit spoke from God.”"}, {"t": "p", "html": "The next time someone challenges the Bible as God’s Word or the deity of Jesus Christ challenge them to study the prophecies of the Bible!"}]}, {"n": 7, "title": "Prayer", "ref": "1 John 5:14-15", "verse": "And this is the confidence which we have before Him, that if we ask anything according to His will, He hears us. And if we know that He hears us in whatever we ask, we know that we have the requests which we have asked Him.", "blocks": [{"t": "f", "label": "Hebrews 4:16 As a Christian what special privileges are you given?", "rows": 3, "num": 1, "id": 0}, {"t": "q", "num": 2, "label": "Psalms 62:8; 1 Thessalonians 5:17 Because God is your refuge, what are you told to do?"}, {"t": "f", "label": "", "rows": 2, "id": 1}, {"t": "q", "num": 3, "label": "There are different types of prayer depending upon the thoughts you want to express. From the following Scriptures list the various types:"}, {"t": "f", "label": "1 Samuel 12:23", "rows": 1, "id": 2}, {"t": "f", "label": "Psalms 38:18", "rows": 1, "id": 3}, {"t": "f", "label": "Hebrews 13:15", "rows": 1, "id": 4}, {"t": "f", "label": "Ephesians 5:20", "rows": 1, "id": 5}, {"t": "f", "label": "James 1:5", "rows": 1, "id": 6}, {"t": "f", "label": "Luke 11:3", "rows": 1, "id": 7}, {"t": "f", "label": "Jeremiah 33:3; Ephesians 3:20 What truth do you find in these Scriptures?", "rows": 3, "num": 4, "id": 8}, {"t": "q", "num": 5, "label": "What should result from time spent in prayer?"}, {"t": "f", "label": "John 16:24", "rows": 1, "id": 9}, {"t": "f", "label": "Psalms 55:22", "rows": 1, "id": 10}, {"t": "f", "label": "Psalms 145:18", "rows": 1, "id": 11}, {"t": "f", "label": "Psalms 34:4 What did the psalmist experience in prayers?", "rows": 3, "num": 6, "id": 12}, {"t": "f", "label": "What are some fears you need to discuss with God?", "rows": 2, "id": 13}, {"t": "q", "num": 7, "label": "Philippians 4:6-7 is a powerful key to freedom from fear and anxiety."}, {"t": "f", "label": "A. What are you instructed to do?", "rows": 2, "id": 14}, {"t": "f", "label": "B. What is God’s promise?", "rows": 1, "id": 15}, {"t": "q", "num": 8, "label": "What conditions of prayer do you find in the following verses?"}, {"t": "f", "label": "Matthew 21:22", "rows": 1, "id": 16}, {"t": "f", "label": "John 15:7", "rows": 1, "id": 17}, {"t": "f", "label": "John 14:13; 16:24", "rows": 1, "id": 18}, {"t": "f", "label": "1 John 5:14-15", "rows": 1, "id": 19}, {"t": "q", "num": 9, "label": "Nehemiah 8:1-8; Psalms 1:2; Psalm 119:97-99 How can you know God’s will in prayer?"}, {"t": "f", "label": "", "rows": 2, "id": 20}, {"t": "q", "num": 10, "label": "What are hindrances to answered prayer?"}, {"t": "f", "label": "Psalms 66:18; Isaiah 59:1-2", "rows": 1, "id": 21}, {"t": "f", "label": "Proverbs 21:13", "rows": 1, "id": 22}, {"t": "f", "label": "Proverbs 28:9", "rows": 1, "id": 23}, {"t": "f", "label": "Matthew 5:22-24", "rows": 1, "id": 24}, {"t": "f", "label": "James 1:6-7", "rows": 1, "id": 25}, {"t": "f", "label": "1 Peter 3:7", "rows": 1, "id": 26}, {"t": "f", "label": "James 4:3", "rows": 1, "id": 27}, {"t": "f", "label": "Psalms 139:23-24 What did the psalmist pray?", "rows": 3, "num": 11, "id": 28}, {"t": "f", "label": "Why is it a good idea to pray that way? (Read Jeremiah 17:9-10 to help you answer this question.)", "rows": 3, "id": 29}, {"t": "f", "label": "Luke 5:16; 6:12; 9:28 What was Jesus’ prayer life like?", "rows": 3, "num": 12, "id": 30}, {"t": "q", "num": 13, "label": "In Matthew 6:9-13 Jesus gives us a pattern for prayer."}, {"t": "f", "label": "A. How does it begin?", "rows": 1, "id": 31}, {"t": "f", "label": "Why is this important?", "rows": 1, "id": 32}, {"t": "p", "html": "B. What type of requests follow?"}, {"t": "f", "label": "Verse 10", "rows": 1, "id": 33}, {"t": "f", "label": "Verse 11", "rows": 1, "id": 34}, {"t": "f", "label": "Verse 12", "rows": 1, "id": 35}, {"t": "f", "label": "Verse 13", "rows": 1, "id": 36}, {"t": "q", "num": 14, "label": "What are some things God desires you to pray for?"}, {"t": "f", "label": "Psalms 122:6", "rows": 1, "id": 37}, {"t": "f", "label": "Matthew 9:37-38", "rows": 1, "id": 38}, {"t": "f", "label": "Luke 6:28", "rows": 1, "id": 39}, {"t": "f", "label": "Luke 21:34-36", "rows": 1, "id": 40}, {"t": "f", "label": "James 5:16", "rows": 1, "id": 41}, {"t": "f", "label": "Colossians 1:9-10", "rows": 1, "id": 42}, {"t": "f", "label": "Colossians 4:3", "rows": 1, "id": 43}, {"t": "f", "label": "Philippians 1:9", "rows": 1, "id": 44}, {"t": "f", "label": "1 Timothy 2:1-4", "rows": 1, "id": 45}, {"t": "f", "label": "2 Thessalonians 3:1-2", "rows": 1, "id": 46}, {"t": "f", "label": "Matthew 6:8 Does God know what you need before you ask?", "rows": 2, "num": 15, "id": 47}, {"t": "q", "num": 16, "label": "Then why do you need to pray at all? To help you answer this question read the story of King Asa in 2 Chronicles 16:7-13 along with Isaiah 10:20; Isaiah 31:1; and 2 Corinthians 1:9."}, {"t": "p", "html": "Remember, “no” and “wait” are also answers to prayer."}]}, {"n": 8, "title": "God The Father", "ref": "Isaiah 49:15-16", "verse": "Can a woman forget her nursing child, and have no compassion on the son of her womb? Even these may forget, but I will not forget you. Behold, I have inscribed you on the palms of My Hands.", "blocks": [{"t": "q", "num": 1, "label": "How does God reveal Himself in the following verses?"}, {"t": "f", "label": "2 Corinthians 6:18", "rows": 1, "id": 0}, {"t": "f", "label": "Luke 11:2", "rows": 1, "id": 1}, {"t": "f", "label": "When you call God, Father, what do you think of?", "rows": 2, "num": 2, "id": 2}, {"t": "p", "html": "A. Make a list of the character traits of your earthly father (or the person who raised you)."}, {"t": "f", "label": "", "rows": 2, "id": 3}, {"t": "p", "html": "B. Now based on the following Scriptures, list God the Father’s character traits."}, {"t": "f", "label": "Psalms 18:35", "rows": 1, "id": 4}, {"t": "f", "label": "Psalms 27:10", "rows": 1, "id": 5}, {"t": "f", "label": "Psalms 34:8", "rows": 1, "id": 6}, {"t": "f", "label": "Psalms 34:18", "rows": 1, "id": 7}, {"t": "f", "label": "Psalms 36:5", "rows": 1, "id": 8}, {"t": "f", "label": "Psalms 36:7-8", "rows": 1, "id": 9}, {"t": "f", "label": "Psalms 37:24", "rows": 1, "id": 10}, {"t": "f", "label": "Psalms 37:39-40", "rows": 1, "id": 11}, {"t": "f", "label": "Psalms 40:11", "rows": 1, "id": 12}, {"t": "f", "label": "Psalms 68:19", "rows": 1, "id": 13}, {"t": "f", "label": "Psalms 86:15", "rows": 1, "id": 14}, {"t": "f", "label": "Psalms 116:1-2", "rows": 1, "id": 15}, {"t": "f", "label": "Psalms 136:1", "rows": 1, "id": 16}, {"t": "f", "label": "Psalms 145:8", "rows": 1, "id": 17}, {"t": "f", "label": "Psalms 145:14", "rows": 1, "id": 18}, {"t": "f", "label": "Psalms 145:17", "rows": 1, "id": 19}, {"t": "f", "label": "Psalms 146:9", "rows": 1, "id": 20}, {"t": "f", "label": "Psalms 147:3", "rows": 1, "id": 21}, {"t": "f", "label": "Jeremiah 31:3", "rows": 1, "id": 22}, {"t": "f", "label": "1 John 4:8", "rows": 1, "id": 23}, {"t": "f", "label": "2 Corinthians 7:6", "rows": 1, "id": 24}, {"t": "p", "html": "Are there any similarities or differences between your earthly father and God the Father?"}, {"t": "f", "label": "", "rows": 2, "id": 25}, {"t": "p", "html": "Do you view the Heavenly Father according to the way He has revealed Himself in Scripture?"}, {"t": "f", "label": "", "rows": 2, "id": 26}, {"t": "p", "html": "Food for thought: If you have trouble accepting God the Father the way He has revealed Himself, maybe it is because you have subconsciously viewed God the Father in the same way you view your earthly father."}, {"t": "f", "label": "Numbers 23:19 According to this Scripture, does God break His promises?", "rows": 2, "num": 3, "id": 27}, {"t": "f", "label": "Has your earthly father ever broken promises to you?", "rows": 1, "id": 28}, {"t": "q", "num": 4, "label": "Psalms 51:5; Romans 3:23 Why can’t man be a “perfect” father like God the Father?"}, {"t": "f", "label": "", "rows": 2, "id": 29}, {"t": "p", "html": "Take time to pray right now. If your earthly father did a good job representing God the Father to you, then thank God and bless your father by letting him know how much you appreciate him. You may want to take time to write him a letter thanking him for the positive and loving influence he had upon your life. If your dad misrepresented God the Father to you take time in prayer to forgive him and release your disappointments, anger, bitterness, or even hatred toward him. Then ask God to forgive you for harboring these things in your heart. Ask God to renew your mind with the truth so that you can enter into a close and loving relationship with Him."}, {"t": "p", "html": "Note: If your father has died, you can still write a letter to him and lift the letter up to Jesus letting go of all the things you wish you had said to your father, but never had the chance."}, {"t": "q", "num": 5, "label": "From the following Scriptures list some steps you can take to develop a more intimate and loving relationship with your Heavenly Father."}, {"t": "f", "label": "Psalms 1:2", "rows": 1, "id": 30}, {"t": "f", "label": "Psalms 59:16", "rows": 1, "id": 31}, {"t": "f", "label": "Psalms 89:1", "rows": 1, "id": 32}, {"t": "f", "label": "Psalms 95:6", "rows": 1, "id": 33}, {"t": "f", "label": "Psalms 100:4", "rows": 1, "id": 34}, {"t": "f", "label": "Psalms 141:2", "rows": 1, "id": 35}, {"t": "f", "label": "Romans 12:1-2", "rows": 1, "id": 36}, {"t": "f", "label": "Philippians 4:8-9", "rows": 1, "id": 37}, {"t": "f", "label": "Jeremiah 33:3", "rows": 1, "id": 38}, {"t": "f", "label": "Hebrews 4:16", "rows": 1, "id": 39}, {"t": "f", "label": "Mark 1:35", "rows": 1, "id": 40}, {"t": "f", "label": "Luke 21:38", "rows": 1, "id": 41}]}, {"n": 9, "title": "The Obedient Christian", "ref": "Romans 6:11", "verse": "Even so consider yourselves to be dead to sin but alive to God in Christ Jesus.", "blocks": [{"t": "f", "label": "1 John 5:2-3; John 14:15-21 Reflect on these Scriptures and briefly state the relationship between loving God and obeying God.", "rows": 3, "num": 1, "id": 0}, {"t": "f", "label": "Romans 5:5; 1 John 4:19 What makes it possible for you to truly love God?", "rows": 3, "num": 2, "id": 1}, {"t": "q", "num": 3, "label": "According to the following Scriptures, what are some specific instructions that you need to take to heart and obey?"}, {"t": "f", "label": "Matthew 5:44-45", "rows": 1, "id": 2}, {"t": "f", "label": "Luke 17:4", "rows": 1, "id": 3}, {"t": "f", "label": "Romans 13:1", "rows": 1, "id": 4}, {"t": "f", "label": "1 Corinthians 16:14", "rows": 1, "id": 5}, {"t": "f", "label": "Galatians 6:6", "rows": 1, "id": 6}, {"t": "f", "label": "Ephesians 4:26", "rows": 1, "id": 7}, {"t": "f", "label": "Ephesians 5:3", "rows": 1, "id": 8}, {"t": "f", "label": "Hebrews 13:1-2", "rows": 1, "id": 9}, {"t": "f", "label": "1 Peter 4:9", "rows": 1, "id": 10}, {"t": "f", "label": "1 John 4:21", "rows": 1, "id": 11}, {"t": "f", "label": "Matthew 22:36-40 Meditate on this passage of Scripture and in your own words explain what Jesus said.", "rows": 2, "num": 4, "id": 12}, {"t": "q", "num": 5, "label": "From the following Scriptures, what are the results of obeying the Lord from your heart?"}, {"t": "f", "label": "Deuteronomy 28:1-14", "rows": 1, "id": 13}, {"t": "f", "label": "2 Chronicles 16:9", "rows": 1, "id": 14}, {"t": "f", "label": "Proverbs 16:7", "rows": 1, "id": 15}, {"t": "f", "label": "Matthew 5:19", "rows": 1, "id": 16}, {"t": "f", "label": "John 8:31-32", "rows": 1, "id": 17}, {"t": "f", "label": "John 14:23", "rows": 1, "id": 18}, {"t": "f", "label": "John 15:10", "rows": 1, "id": 19}, {"t": "f", "label": "James 1:25", "rows": 1, "id": 20}, {"t": "f", "label": "Hebrews 10:35-36", "rows": 1, "id": 21}, {"t": "q", "num": 6, "label": "Let’s compare two types of people presented by Jesus in Matthew 7:24-27. The wise man and the foolish man. Read the passages and answer the following questions."}, {"t": "f", "label": "On what foundations were the houses built?", "rows": 1, "id": 22}, {"t": "f", "label": "To what forces were the houses exposed?", "rows": 1, "id": 23}, {"t": "f", "label": "What was the result?", "rows": 1, "id": 24}, {"t": "f", "label": "How did these two men differ?", "rows": 1, "id": 25}, {"t": "q", "num": 7, "label": "1 Corinthians 10:13 Are the temptations you face more difficult than those faced by others?"}, {"t": "f", "label": "", "rows": 2, "id": 26}, {"t": "f", "label": "What is God’s promise to you concerning temptations?", "rows": 1, "id": 27}, {"t": "f", "label": "Matthew 4:1-3 Who is the tempter?", "rows": 2, "num": 8, "id": 28}, {"t": "f", "label": "James 1:13 Who is never the source of temptation?", "rows": 2, "num": 9, "id": 29}, {"t": "f", "label": "James 1:14-15 What causes you to be drawn into temptation?", "rows": 2, "num": 10, "id": 30}, {"t": "f", "label": "What will it lead to?", "rows": 1, "id": 31}, {"t": "f", "label": "Using the following verses as a guide, write a brief definition of sin. Isaiah 53:6; James 4:17; 1 John 3:4", "rows": 3, "num": 11, "id": 32}, {"t": "f", "label": "How does sin differ from temptation?", "rows": 1, "id": 33}, {"t": "f", "label": "Joshua 7:20-21 What factors contributed to Achan’s disobedience?", "rows": 3, "num": 12, "id": 34}, {"t": "f", "label": "At what point could he have prevented his sin?", "rows": 1, "id": 35}, {"t": "f", "label": "What can you learn from Achan’s error?", "rows": 1, "id": 36}, {"t": "f", "label": "James 1:22 What does God’s Word say about a person who merely hears the Word of God but does not obey it?", "rows": 2, "num": 13, "id": 37}, {"t": "q", "num": 14, "label": "1 John 1:9; Psalms 32:5 Once you have sinned, what is God’s provision to restore you?"}, {"t": "f", "label": "", "rows": 2, "id": 38}, {"t": "q", "num": 15, "label": "God does not expect you to live an obedient life in your own strength! What are His provisions to help you live victoriously?"}, {"t": "f", "label": "Romans 15:4", "rows": 1, "id": 39}, {"t": "f", "label": "1 Corinthians 3:16", "rows": 1, "id": 40}, {"t": "f", "label": "Galatians 2:20", "rows": 1, "id": 41}, {"t": "f", "label": "1 John 4:4", "rows": 1, "id": 42}, {"t": "f", "label": "2 Timothy 1:7", "rows": 1, "id": 43}, {"t": "f", "label": "2 Peter 1:3", "rows": 1, "id": 44}, {"t": "q", "num": 16, "label": "Has God’s Word made you aware of an area in your life which needs to be brought into close obedience? If so, take time right now to find a Scripture that will help you gain strength in this area of your life. Memorize it and begin to pray it daily."}, {"t": "p", "html": "Write out the Scripture you have chosen."}, {"t": "f", "label": "", "rows": 2, "id": 45}, {"t": "p", "html": "Matthew 4:4 Jesus answered, “It is written Man does not live by bread alone, but on every word that comes from the mouth of God.”"}, {"t": "p", "html": "Remember, obey God because you love Him, not because you want Him to love you more. He already loves you with an unconditional love that goes beyond human understanding. Obedience won’t buy His love, but it will result in blessing and victory."}]}, {"n": 10, "title": "The Authority of God’s Word", "ref": "Psalms 119:105", "verse": "Thy Word is a lamp to my feet, and a light to my path.", "blocks": [{"t": "p", "html": "God’s Word is also referred to as His commandments, testimonies, precepts, judgments, and laws."}, {"t": "f", "label": "2 Timothy 3:16 Who wrote the Bible?", "rows": 2, "num": 1, "id": 0}, {"t": "q", "num": 2, "label": "What importance does God place on His Word?"}, {"t": "f", "label": "Psalms 119:89", "rows": 1, "id": 1}, {"t": "f", "label": "Psalms 138:2", "rows": 1, "id": 2}, {"t": "f", "label": "Isaiah 40:8", "rows": 1, "id": 3}, {"t": "f", "label": "Jeremiah 1:12", "rows": 1, "id": 4}, {"t": "q", "num": 3, "label": "What did Jesus say about Scripture?"}, {"t": "f", "label": "Matthew 5:18", "rows": 1, "id": 5}, {"t": "f", "label": "Mark 13:31", "rows": 1, "id": 6}, {"t": "f", "label": "John 17:17", "rows": 1, "id": 7}, {"t": "q", "num": 4, "label": "What do the following Scriptures say about the reliability of God’s Word?"}, {"t": "f", "label": "Joshua 23:14", "rows": 1, "id": 8}, {"t": "f", "label": "Psalms 33:4", "rows": 1, "id": 9}, {"t": "f", "label": "Proverbs 30:5-6", "rows": 2, "id": 10}, {"t": "q", "num": 5, "label": "How is the Word of God described in the following passages of Scripture?"}, {"t": "f", "label": "Psalms 19:7-8", "rows": 2, "id": 11}, {"t": "f", "label": "Psalms 111:7-8", "rows": 2, "id": 12}, {"t": "f", "label": "Psalms 119:114, 151, 160", "rows": 2, "id": 13}, {"t": "f", "label": "Isaiah 55:10-11", "rows": 1, "id": 14}, {"t": "f", "label": "Ephesians 5:26", "rows": 1, "id": 15}, {"t": "f", "label": "Hebrews 4:12", "rows": 1, "id": 16}, {"t": "q", "num": 6, "label": "To what does God compare His Word?"}, {"t": "f", "label": "Jeremiah 5:14", "rows": 1, "id": 17}, {"t": "f", "label": "Psalms 119:105", "rows": 1, "id": 18}, {"t": "f", "label": "Jeremiah 23:29", "rows": 1, "id": 19}, {"t": "f", "label": "Ephesians 6:17", "rows": 1, "id": 20}, {"t": "q", "num": 7, "label": "What is the Word of God able to do in your life?"}, {"t": "f", "label": "Psalms 37:31", "rows": 1, "id": 21}, {"t": "f", "label": "Psalms 119:130", "rows": 1, "id": 22}, {"t": "f", "label": "Proverbs 4:20-22", "rows": 1, "id": 23}, {"t": "f", "label": "John 15:3", "rows": 1, "id": 24}, {"t": "f", "label": "Acts 20:32", "rows": 1, "id": 25}, {"t": "f", "label": "Romans 10:17", "rows": 1, "id": 26}, {"t": "f", "label": "2 Timothy 3:16-17", "rows": 1, "id": 27}, {"t": "f", "label": "James 1:21", "rows": 1, "id": 28}, {"t": "f", "label": "Mark 4:14 A farmer sows seed in order to reap a harvest. What must you sow in order to reap a spiritual harvest?", "rows": 2, "num": 8, "id": 29}, {"t": "f", "label": "What are some ways you can be a sower during the next week?", "rows": 2, "id": 30}, {"t": "f", "label": "2 Kings 22:8-20; 23:2-4 How did King Josiah respond to God’s Word?", "rows": 3, "num": 9, "id": 31}, {"t": "f", "label": "Joshua 7:6; Job 1:20 What does “tearing your robe” symbolize?", "rows": 1, "id": 32}, {"t": "f", "label": "How did Josiah put God’s Word into practice? 2 Kings 23:25", "rows": 2, "id": 33}, {"t": "p", "html": "When you read God’s Word does it pierce your heart like it did Josiah’s? Does it move you to make changes? If not, pray and ask God to open your spiritual eyes and bring you understanding of His Word and His Ways. Ask Him to give you a tender and teachable heart."}, {"t": "f", "label": "Psalms 119:18 What did David pray before reading God’s Word?", "rows": 3, "num": 10, "id": 34}, {"t": "q", "num": 11, "label": "1 Corinthians 2:14 Why do unsaved people have difficulty understanding God’s Word?"}, {"t": "f", "label": "", "rows": 2, "id": 35}, {"t": "f", "label": "Read Psalms 119. Write down some specific steps you can take to begin applying God’s Word to your life.", "rows": 3, "num": 12, "id": 36}, {"t": "p", "html": "STORY: A college professor asked if there was a Christian in his class. One young man dared to raise his hand. The professor had him stand and then proceeded to tear down the Bible and mock the Christian faith. The professor asked the young man how he could possibly believe such fairy tales and outdated teachings. The young man simply responded that God’s Word was a love letter to His children and that the professor didn’t understand the Bible because he was reading someone else’s mail!"}, {"t": "p", "html": "God’s Word is alive to those who are alive in Christ."}]}, {"n": 11, "title": "Harnessing Your Tongue", "ref": "Proverbs 18:21", "verse": "Death and life are in the power of the tongue, and those who love it will eat its fruit.", "blocks": [{"t": "q", "num": 1, "label": "According to Proverbs 18:21, what will result from the words you choose to speak?"}, {"t": "f", "label": "", "rows": 2, "id": 0}, {"t": "q", "num": 2, "label": "What are some “tongue” problems that must be overcome?"}, {"t": "f", "label": "Proverbs 4:24", "rows": 1, "id": 1}, {"t": "f", "label": "Proverbs 5:3", "rows": 1, "id": 2}, {"t": "f", "label": "Proverbs 6:16, 19", "rows": 1, "id": 3}, {"t": "f", "label": "Proverbs 10:19", "rows": 1, "id": 4}, {"t": "f", "label": "Proverbs 11:13", "rows": 1, "id": 5}, {"t": "f", "label": "Proverbs 12:18", "rows": 1, "id": 6}, {"t": "f", "label": "Proverbs 17:20", "rows": 1, "id": 7}, {"t": "f", "label": "Proverbs 18:13", "rows": 1, "id": 8}, {"t": "f", "label": "Psalms 5:9; Proverbs 28:23", "rows": 1, "id": 9}, {"t": "f", "label": "Ephesians 5:4", "rows": 1, "id": 10}, {"t": "f", "label": "2 Timothy 2:14,24", "rows": 1, "id": 11}, {"t": "f", "label": "Titus 3:9", "rows": 1, "id": 12}, {"t": "f", "label": "James 3:5", "rows": 1, "id": 13}, {"t": "f", "label": "Proverbs 11:13 Define Gossip?", "rows": 2, "num": 3, "id": 14}, {"t": "f", "label": "What is the opposite of Gossip?", "rows": 1, "id": 15}, {"t": "q", "num": 4, "label": "Proverbs 26:22 To what does God compare the words of a gossip or whisperer?"}, {"t": "f", "label": "", "rows": 2, "id": 16}, {"t": "f", "label": "Where do these words end up?", "rows": 1, "id": 17}, {"t": "f", "label": "Proverbs 17:9 How does God want you to handle gossip?", "rows": 2, "num": 5, "id": 18}, {"t": "f", "label": "What happens when you repeat a matter?", "rows": 1, "id": 19}, {"t": "p", "html": "Do you remember the following childhood rhyme? “Sticks and stones may break my bones, but names will never hurt me!” According to God’s Word this rhyme is totally false. A physical wound eventually heals, but emotional wounds caused by hurtful words may fester inside a person for untold years!"}, {"t": "q", "num": 6, "label": "How does God describe a person with an unruly tongue?"}, {"t": "f", "label": "Proverbs 12:18", "rows": 1, "id": 20}, {"t": "f", "label": "Proverbs 26:18-19", "rows": 1, "id": 21}, {"t": "f", "label": "Proverbs 12:22", "rows": 1, "id": 22}, {"t": "f", "label": "Jeremiah 9:8", "rows": 1, "id": 23}, {"t": "f", "label": "Proverbs 25:18", "rows": 1, "id": 24}, {"t": "f", "label": "Proverbs 18:7 What results from an “evil” tongue?", "rows": 2, "num": 7, "id": 25}, {"t": "q", "num": 8, "label": "How does God describe a “wholesome” tongue?"}, {"t": "f", "label": "Proverbs 10:11", "rows": 1, "id": 26}, {"t": "f", "label": "Proverbs 10:21", "rows": 1, "id": 27}, {"t": "f", "label": "Proverbs 10:13,19", "rows": 1, "id": 28}, {"t": "f", "label": "Proverbs 10:31", "rows": 1, "id": 29}, {"t": "f", "label": "Proverbs 10:20", "rows": 1, "id": 30}, {"t": "f", "label": "Proverbs 12:18", "rows": 1, "id": 31}, {"t": "f", "label": "Proverbs 16:24", "rows": 1, "id": 32}, {"t": "f", "label": "Proverbs 15:26", "rows": 1, "id": 33}, {"t": "f", "label": "Proverbs 21:23", "rows": 1, "id": 34}, {"t": "q", "num": 9, "label": "What are the rewards of harnessing your tongue?"}, {"t": "f", "label": "Proverbs 13:3", "rows": 1, "id": 35}, {"t": "f", "label": "Proverbs 17:27-28", "rows": 1, "id": 36}, {"t": "f", "label": "James 3:2", "rows": 1, "id": 37}, {"t": "q", "num": 10, "label": "Psalms 39:1 and Psalms 73:2-3 When was King David most tempted to sin with his tongue?"}, {"t": "f", "label": "", "rows": 2, "id": 38}, {"t": "f", "label": "Psalms 73:16-19 What made David change his attitude about the seeing “prosperity and blessings” of wicked people?", "rows": 2, "id": 39}, {"t": "p", "html": "Has Satan ever tempted you to complain about or even condemn an unbeliever’s successes or prosperity. Ask God to open your spiritual eyes, as with David, to see eternal blessings."}, {"t": "q", "num": 11, "label": "It is not enough to simply stop old habits they must be replaced with new habits. Old habits lose their hold as Godly habits start to grow. What are some things you can begin to practice that will help change you into a more Christ-like person?"}, {"t": "f", "label": "1 Peter 3:9", "rows": 1, "id": 40}, {"t": "f", "label": "Psalms 71:23-24", "rows": 1, "id": 41}, {"t": "f", "label": "Proverbs 31:26", "rows": 1, "id": 42}, {"t": "f", "label": "Ephesians 5:", "rows": 1, "id": 43}, {"t": "f", "label": "Ephesians 5:18-20", "rows": 1, "id": 44}, {"t": "f", "label": "Colossians 4:6", "rows": 1, "id": 45}, {"t": "f", "label": "James 1:19", "rows": 1, "id": 46}, {"t": "p", "html": "Take time to write out a simple prayer for yourself based on the above Scriptures. Pray this for yourself on a daily basis until it becomes a reality in your life. Remember, as you confess your sins daily, He is faithful and just to forgive you. God will change you as you keep yourself in an attitude of repentance and prayer."}]}, {"n": 12, "title": "The Lordship of Christ", "ref": "Philippians 2:9", "verse": "Therefore also God highly exalted Him, and bestowed on Him the name which is above every name, that at the name of Jesus every knee should bow of those who are in heaven, and on earth, and under the earth, and that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father.", "blocks": [{"t": "q", "num": 1, "label": "Titles give important information about a person. What are some of Christ’s titles?"}, {"t": "f", "label": "John 13:13", "rows": 1, "id": 0}, {"t": "f", "label": "Acts 2:36", "rows": 1, "id": 1}, {"t": "f", "label": "Revelation 19:16", "rows": 1, "id": 2}, {"t": "f", "label": "What do these titles reveal about Jesus?", "rows": 2, "id": 3}, {"t": "f", "label": "Write your own definition of the title “Lord.”", "rows": 2, "id": 4}, {"t": "p", "html": "Webster’s Dictionary defines “Lord” as Master, Nobleman, God, Jesus Christ."}, {"t": "q", "num": 2, "label": "What is Jesus Lord over?"}, {"t": "f", "label": "Colossians 1:16-17", "rows": 1, "id": 5}, {"t": "f", "label": "Romans 14:9", "rows": 1, "id": 6}, {"t": "q", "num": 3, "label": "According to Philippians 2:9-11"}, {"t": "f", "label": "How has God exalted Jesus Christ?", "rows": 2, "id": 7}, {"t": "f", "label": "How will every person exalt Him?", "rows": 2, "id": 8}, {"t": "f", "label": "Revelation 5:11-12 How do the angels acknowledge Christ’s Lordship?", "rows": 3, "num": 4, "id": 9}, {"t": "f", "label": "Colossians 1:18 What place should Christ hold in your life?", "rows": 2, "num": 5, "id": 10}, {"t": "f", "label": "Jeremiah 29:11 How does this statement dispel any fears you may have about turning your life over to the control of Christ?", "rows": 3, "num": 6, "id": 11}, {"t": "q", "num": 7, "label": "Have you given Christ control over all areas of your life? Grade yourself on a scale of 1 to 10, 10 being total surrender."}, {"t": "f", "label": "Marriage and family", "rows": 1, "id": 12}, {"t": "f", "label": "Money", "rows": 1, "id": 13}, {"t": "f", "label": "Career", "rows": 1, "id": 14}, {"t": "f", "label": "Education", "rows": 1, "id": 15}, {"t": "f", "label": "Leisure time", "rows": 1, "id": 16}, {"t": "f", "label": "Relationships", "rows": 1, "id": 17}, {"t": "f", "label": "Ministry work", "rows": 1, "id": 18}, {"t": "f", "label": "Possessions", "rows": 1, "id": 19}, {"t": "p", "html": "A good way to determine if Christ is in control is to ask, “Am I willing to do whatever Christ desires in this area?” Do you know what Christ desires in each of these areas? If not, bring it up for discussion so that understanding can be gained. Continuing Bible study will bring understanding."}, {"t": "p", "html": "If there are areas that are not submitted, what can you do to make the necessary changes?"}, {"t": "f", "label": "", "rows": 3, "id": 20}, {"t": "q", "num": 8, "label": "If you assume control over any area of your life, you will soon become fretful, anxious, worried, weary. What should you do if you find yourself in this condition?"}, {"t": "f", "label": "1 Peter 5:6-7", "rows": 2, "id": 21}, {"t": "f", "label": "Matthew 11:28-30", "rows": 2, "id": 22}, {"t": "p", "html": "It does take an active decision on your part to recognize Christ’s Lordship. Just as a bride makes a decision to say “I do,” marry her groom and place him as the number one love in her heart, so it is with our relationship with Christ. Through an act of our will, we choose to respond to Christ’s call to come to Him and enthrone Him in our heart, calling Him Lord."}, {"t": "q", "num": 9, "label": "What are the results of giving Jesus Lordship of your life?"}, {"t": "f", "label": "Matthew 6:31-33", "rows": 2, "id": 23}, {"t": "f", "label": "Mark 10:28-30", "rows": 2, "id": 24}, {"t": "f", "label": "John 16:33", "rows": 1, "id": 25}, {"t": "f", "label": "Philippians 4:11-13", "rows": 2, "id": 26}, {"t": "f", "label": "Philippians 4:19", "rows": 1, "id": 27}, {"t": "q", "num": 10, "label": "Luke 6:46 What is a good way to evaluate whether or not you have truly made Jesus your Lord?"}, {"t": "f", "label": "", "rows": 2, "id": 28}, {"t": "p", "html": "Take time to pray and submit each area of your life to the Lordship of Jesus Christ. You may need to submit your life to His control each and every morning reminding yourself who’s the boss!"}]}, {"n": 13, "title": "Faith", "ref": "Hebrews 11:6", "verse": "And without faith it is impossible to please Him, for he who comes to God must believe that He is, and that He is a rewarder of those who seek Him.", "blocks": [{"t": "p", "html": "Do you have faith or wishful thinking? Do you try to “think positive” and “hope” everything will work out all right, or do you have faith that God will work everything out? The Biblical concept of faith is so much deeper than wishful thinking or making positive confessions that will hopefully come true!"}, {"t": "q", "num": 1, "label": "The importance of faith is seen in that:"}, {"t": "f", "label": "A. John 3:36 You cannot be", "rows": 1, "id": 0}, {"t": "f", "label": "without faith.", "rows": 1, "id": 1}, {"t": "f", "label": "B. 1 John 5:4 You cannot live", "rows": 1, "id": 2}, {"t": "f", "label": "over the world without faith.", "rows": 1, "id": 3}, {"t": "f", "label": "C. Hebrews 11:6 You cannot", "rows": 1, "id": 4}, {"t": "f", "label": "God without faith.", "rows": 1, "id": 5}, {"t": "f", "label": "D. Mark 11:24 You cannot", "rows": 1, "id": 6}, {"t": "f", "label": "without faith.", "rows": 1, "id": 7}, {"t": "f", "label": "E. Galatians 2:16 You are", "rows": 1, "id": 8}, {"t": "f", "label": "by faith and not by works.", "rows": 1, "id": 9}, {"t": "f", "label": "F. Galatians 2:20 You are to", "rows": 1, "id": 10}, {"t": "f", "label": "by faith.", "rows": 1, "id": 11}, {"t": "f", "label": "G. Romans 10:1-4 You are made", "rows": 1, "id": 12}, {"t": "f", "label": "by faith.", "rows": 1, "id": 13}, {"t": "f", "label": "H. Ephesians 3:17 Christ", "rows": 1, "id": 14}, {"t": "f", "label": "in your heart by faith.", "rows": 1, "id": 15}, {"t": "f", "label": "I. Romans 14:23 Whatever is not from faith is", "rows": 1, "id": 16}, {"t": "f", "label": ".", "rows": 1, "id": 17}, {"t": "f", "label": "Ephesians 2:8-9 What part did faith play in the beginning of the Christian life?", "rows": 3, "num": 2, "id": 18}, {"t": "f", "label": "Colossians 2:6-7 How should you live as a Christian?", "rows": 2, "num": 3, "id": 19}, {"t": "q", "num": 4, "label": "From the following Scriptures write a definition of faith."}, {"t": "f", "label": "Acts 27:25", "rows": 1, "id": 20}, {"t": "f", "label": "Romans 4:20-21", "rows": 1, "id": 21}, {"t": "f", "label": "Hebrews 11:1", "rows": 1, "id": 22}, {"t": "f", "label": "2 Corinthians 5:7 In your own words explain this key principle for living a victorious Christian life and, if you can, give an example of how you applied it in your life.", "rows": 3, "num": 5, "id": 23}, {"t": "f", "label": "Mark 11:22 Who should be the object of your faith?", "rows": 2, "num": 6, "id": 24}, {"t": "f", "label": "Jeremiah 17:7-8 God rewards those who put their faith in Him. What are some of those rewards?", "rows": 2, "num": 7, "id": 25}, {"t": "q", "num": 8, "label": "From the following Scriptures, what are some of the unworthy objects in which people sometimes place their faith?"}, {"t": "f", "label": "Deuteronomy 4:15-19", "rows": 1, "id": 26}, {"t": "f", "label": "Psalms 33:16-17", "rows": 1, "id": 27}, {"t": "f", "label": "Psalms 146:3", "rows": 1, "id": 28}, {"t": "f", "label": "Proverbs 3:5", "rows": 1, "id": 29}, {"t": "f", "label": "Proverbs 11:28", "rows": 1, "id": 30}, {"t": "f", "label": "Proverbs 28:26", "rows": 1, "id": 31}, {"t": "f", "label": "Is God the object of your faith? Ask yourself this question: Where do I run for help when troubles arise?", "rows": 2, "id": 32}, {"t": "f", "label": "Luke 17:5-6 How much faith do you need for God to work in your life?", "rows": 2, "num": 9, "id": 33}, {"t": "f", "label": "Romans 12:3 Does every believer have faith?", "rows": 2, "num": 10, "id": 34}, {"t": "f", "label": "Romans 10:17 What is the relationship between the Word and faith?", "rows": 2, "num": 11, "id": 35}, {"t": "f", "label": "Hebrews 12:2 Who helps your faith develop and grow?", "rows": 2, "num": 12, "id": 36}, {"t": "f", "label": "1 Corinthians 13:2; Galatians 5:6 What must motivate your faith?", "rows": 3, "num": 13, "id": 37}, {"t": "li", "html": "Faith is taking God at His Word! Simply choosing to believe what He says rather than your own feelings or circumstances."}, {"t": "q", "num": 14, "label": "Romans 4:18-21 Abraham is an example of a man of faith. He was 100 years old when his son Isaac was born and his wife was 90, well past the child-bearing age! Describe Abraham’s faith."}, {"t": "f", "label": "Verse 18", "rows": 1, "id": 38}, {"t": "f", "label": "Verse 19", "rows": 1, "id": 39}, {"t": "f", "label": "Verse 20", "rows": 1, "id": 40}, {"t": "f", "label": "Verse 21", "rows": 1, "id": 41}, {"t": "p", "html": "If Abraham did not consider his physical circumstances and his feelings, what did he consider?"}, {"t": "f", "label": "Verse 20", "rows": 1, "id": 42}, {"t": "q", "num": 15, "label": "Luke 1:30-45 Mary conceived Jesus through faith in God’s promise spoken to her through an angel."}, {"t": "f", "label": "Verse 34 Why did this seem impossible to fulfill?", "rows": 1, "id": 43}, {"t": "f", "label": "Verses 35-37 What was the angel’s explanation, and do you think the angel’s explanation took care of all of Mary’s questions?", "rows": 2, "id": 44}, {"t": "f", "label": "Verse 38 How did Mary respond to God’s Word?", "rows": 1, "id": 45}, {"t": "f", "label": "Verse 45 Elizabeth, inspired by the Holy Spirit, spoke to Mary. What did God express to Mary concerning her faith?", "rows": 2, "id": 46}, {"t": "q", "num": 16, "label": "John 20:24-29 Thomas was a “doubting” disciple. Although he was a doubter, he was not an “unbeliever.” Doubting can be cleared up with more information, but unbelief chooses not to believe even in the face of more facts and information."}, {"t": "f", "label": "Verses 24-25 What was Thomas’s problem?", "rows": 1, "id": 47}, {"t": "f", "label": "Verses 26-28 At what point did Thomas believe?", "rows": 1, "id": 48}, {"t": "f", "label": "Verse 29 What was Jesus’ response to Thomas’ faith?", "rows": 2, "id": 49}, {"t": "q", "num": 17, "label": "Mark 9:17-24 A desperate father seeks out Jesus disciples for the healing of his son. The disciples could not cast out the demon in the boy. The father then asked Jesus to take pity on them and help them “if” He can. How did Jesus respond to the father’s weak faith?"}, {"t": "f", "label": "Verse 23", "rows": 1, "id": 50}, {"t": "f", "label": "This father obviously had some faith in Jesus since he brought his son to Him, but what did he ask of Jesus in verse 24?", "rows": 2, "id": 51}, {"t": "f", "label": "Did Jesus respond to his prayer?", "rows": 1, "id": 52}, {"t": "f", "label": "Matthew 13:58 What sin can exclude you from seeing God work?", "rows": 2, "num": 18, "id": 53}, {"t": "li", "html": "Remember: The opposite of faith is not doubt. It is unbelief. Doubt only needs more facts. Unbelief is disobedience and refuses to act in accordance with what God has declared."}, {"t": "li", "html": "We do not try to get faith to manipulate the Word into blessing our lives. Faith is accepting the Word of God at face value, receiving it as we would the word of a trusted friend."}, {"t": "li", "html": "Take time to pray, confessing any unbelief you may have in your heart concerning the Word of God. Ask Jesus, who is the author and perfecter of your faith, to help you grow strong in faith."}]}, {"n": 14, "title": "The Promises of God", "ref": "2 Peter 1:4", "verse": "For by these HE has granted to us His precious and magnificent promises, in order that by them you might become partakers of the divine nature, having escaped the corruption that is in the world of lust.", "blocks": [{"t": "q", "num": 1, "label": "What do the following Scriptures tell you about God’s promises?"}, {"t": "f", "label": "Isaiah 40:8", "rows": 1, "id": 0}, {"t": "f", "label": "1 Kings 8:56", "rows": 1, "id": 1}, {"t": "f", "label": "Romans 4:20-21", "rows": 1, "id": 2}, {"t": "f", "label": "2 Corinthians 1:20", "rows": 1, "id": 3}, {"t": "f", "label": "Titus 1:2", "rows": 1, "id": 4}, {"t": "f", "label": "Hebrews 6:17-18", "rows": 1, "id": 5}, {"t": "f", "label": "2 Peter 1:4", "rows": 1, "id": 6}, {"t": "f", "label": "2 Peter 3:4-9", "rows": 1, "id": 7}, {"t": "q", "num": 2, "label": "Some promises are only for believers. Write out the following promises."}, {"t": "f", "label": "Luke 24:49; Acts 2:38-39", "rows": 1, "id": 8}, {"t": "f", "label": "John 10:28", "rows": 1, "id": 9}, {"t": "f", "label": "Romans 8:1", "rows": 1, "id": 10}, {"t": "f", "label": "1 Corinthians 15:57", "rows": 1, "id": 11}, {"t": "f", "label": "2 Corinthians 1:22", "rows": 1, "id": 12}, {"t": "f", "label": "2 Corinthians 5:21", "rows": 1, "id": 13}, {"t": "f", "label": "Hebrews 9:14", "rows": 1, "id": 14}, {"t": "f", "label": "1 Peter 5:4", "rows": 1, "id": 15}, {"t": "f", "label": "2 Peter 3:13", "rows": 1, "id": 16}, {"t": "f", "label": "Jude 24", "rows": 1, "id": 17}, {"t": "f", "label": "According to Hebrews 6:12, how do you receive these promises?", "rows": 1, "id": 18}, {"t": "q", "num": 3, "label": "Some promises have conditions. Write out the promise and the condition."}, {"t": "f", "label": "Matthew 6:14", "rows": 1, "id": 19}, {"t": "f", "label": "Matthew 6:31-33", "rows": 2, "id": 20}, {"t": "f", "label": "1 John 1:9", "rows": 1, "id": 21}, {"t": "f", "label": "John 15:7", "rows": 1, "id": 22}, {"t": "f", "label": "Jeremiah 29:13", "rows": 1, "id": 23}, {"t": "f", "label": "Romans 10:13", "rows": 1, "id": 24}, {"t": "f", "label": "Philippians 4:6-7", "rows": 1, "id": 25}, {"t": "f", "label": "Colossians 1:22-23", "rows": 1, "id": 26}, {"t": "f", "label": "James 4:7", "rows": 1, "id": 27}, {"t": "f", "label": "According to Hebrews 10:35-36 how do you receive these promises?", "rows": 2, "id": 28}, {"t": "q", "num": 4, "label": "Some promises are for all people. They could be compared to natural laws that operate whether or not people are aware of them; such as the law of gravity. These promises are being fulfilled daily. In your own words write out the following promises."}, {"t": "f", "label": "Galatians 6:7", "rows": 1, "id": 29}, {"t": "f", "label": "John 3:3", "rows": 1, "id": 30}, {"t": "f", "label": "Matthew 7:1-2", "rows": 1, "id": 31}, {"t": "f", "label": "Acts 1:11", "rows": 1, "id": 32}, {"t": "f", "label": "2 Peter 3:10", "rows": 1, "id": 33}, {"t": "f", "label": "Revelation 20:15", "rows": 1, "id": 34}, {"t": "q", "num": 5, "label": "Some promises are specially for the nation of Israel. In your own words write out these promises."}, {"t": "f", "label": "Genesis 12:6-7", "rows": 1, "id": 35}, {"t": "f", "label": "Zechariah 12:9-10", "rows": 1, "id": 36}, {"t": "f", "label": "Ezekiel 39:25-29", "rows": 1, "id": 37}, {"t": "q", "num": 6, "label": "2 Chronicles 20:1-30 King Jehoshaphat stood upon the promises of God."}, {"t": "f", "label": "Verses 3,6-12 What was the first thing he did?", "rows": 2, "id": 38}, {"t": "f", "label": "Verse 15 What promise did God give him?", "rows": 1, "id": 39}, {"t": "f", "label": "Verse 18 How did Jehoshaphat respond
